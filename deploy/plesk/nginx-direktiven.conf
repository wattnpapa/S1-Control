# S1-Control v2 — nginx-Direktiven fuer die Domain in Plesk (ADR-006).
#
# Eintragen unter: Websites & Domains → <Domain> → „Apache & nginx Settings“
# → „Additional nginx directives“. Voraussetzung: „Proxy mode“ ist an (Vorgabe)
# und das Zertifikat kommt von SSL It! (Let's Encrypt) mit Umleitung
# http → https.
#
# Der Port muss zu S1_PLESK_PORT in .env passen (Vorgabe 8085).

location / {
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;

    # Die Web-Schale liest Absender und Protokoll aus diesen Koepfen
    # (S1_WEB_HINTER_PROXY=1); ohne https hier bekommt das Sitzungscookie
    # kein `Secure`.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # /mitteilungen sind Server-Sent Events: nicht puffern, lange offen lassen.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Connection "";

    # Ein Ruf ist hoechstens 1 MB (RUF_MAX_BYTES), ein Erfassungsbogen passt.
    client_max_body_size 2m;
}

location /gesundheit {
    proxy_pass http://127.0.0.1:8085/gesundheit;
    access_log off;
}
