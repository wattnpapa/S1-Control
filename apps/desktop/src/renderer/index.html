<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>S1-Control</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      .arbeitsplatz {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid rgba(128, 128, 128, 0.4);
      }
      header h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      .umgebung {
        font-size: 0.8rem;
        opacity: 0.6;
      }
      main {
        flex: 1;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      h2 {
        font-size: 0.95rem;
        margin: 0 0 0.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.4rem;
      }
      input {
        display: block;
        width: min(40rem, 100%);
        padding: 0.3rem;
      }
      /* Die Statuszeile steht unten und bleibt dort: Sie ist die einzige
         Auskunft ueber Stand und Erreichbarkeit und darf nicht wegscrollen. */
      .statuszeile {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
        padding: 0.4rem 1rem;
        border-top: 1px solid rgba(128, 128, 128, 0.4);
        font-size: 0.85rem;
      }
      .statuszeile .staerke {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      .warnung {
        color: #b45309;
      }
      .fehler {
        color: #b91c1c;
      }
      .fehlerbild {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 0.5rem 1rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #b91c1c;
        border-radius: 4px;
      }
      .hinweistext {
        opacity: 0.7;
      }
      .hinweise ul {
        margin: 0;
        padding-left: 1.2rem;
      }
    </style>
  </head>
  <body>
    <main id="wurzel"></main>
    <script type="module" src="./haupt.tsx"></script>
  </body>
</html>
