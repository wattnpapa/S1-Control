<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>S1-Control</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      .arbeitsplatz {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid rgba(128, 128, 128, 0.4);
      }
      header h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      .umgebung {
        font-size: 0.8rem;
        opacity: 0.6;
      }
      main {
        flex: 1;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      h2 {
        font-size: 0.95rem;
        margin: 0 0 0.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.4rem;
      }
      input {
        display: block;
        width: min(40rem, 100%);
        padding: 0.3rem;
      }
      /* Die Statuszeile steht unten und bleibt dort: Sie ist die einzige
         Auskunft ueber Stand und Erreichbarkeit und darf nicht wegscrollen. */
      .statuszeile {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
        padding: 0.4rem 1rem;
        border-top: 1px solid rgba(128, 128, 128, 0.4);
        font-size: 0.85rem;
      }
      .statuszeile .staerke {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      .warnung {
        color: #b45309;
      }
      .fehler {
        color: #b91c1c;
      }
      .fehlerbild {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 0.5rem 1rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #b91c1c;
        border-radius: 4px;
      }
      .hinweistext {
        opacity: 0.7;
      }
      .hinweise ul {
        margin: 0;
        padding-left: 1.2rem;
      }

      /* ---- Das Lagebild (M3) ------------------------------------------- */

      .lagekopf,
      .baumkopf {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .lagekopf h2,
      .baumkopf h2 {
        margin: 0 0.5rem 0 0;
      }
      .lagespalten {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        align-items: flex-start;
      }
      .baum {
        min-width: 22rem;
        flex: 1 1 22rem;
      }
      .baumliste {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .baumzeile {
        display: flex;
        gap: 0.8rem;
        width: 100%;
        text-align: left;
        background: none;
        border: 1px solid transparent;
        padding: 0.2rem 0.4rem;
        font: inherit;
        cursor: pointer;
      }
      .baumzeile:hover {
        border-color: rgba(128, 128, 128, 0.4);
      }
      .baumzeile.gewaehlt {
        border-color: currentColor;
        font-weight: 600;
      }
      .baumzeile .typ {
        font-size: 0.8rem;
        opacity: 0.6;
      }
      /* Die Zahlen stehen rechts und in Tabellenziffern: Wer Staerken
         vergleicht, liest Spalten und keine Woerter. */
      .baumzeile .zahlen {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-size: 0.85rem;
      }
      .schalter {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        margin: 0;
        font-size: 0.85rem;
      }
      .schalter input {
        display: inline;
        width: auto;
      }
      /* Die Maske liegt ueber der Ansicht, damit der Blick nicht springt,
         und sie ist schmal: Ein Formular, das die ganze Breite fuellt,
         zwingt das Auge bei jeder Zeile quer ueber den Bildschirm. */
      .maske {
        position: fixed;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        min-width: 22rem;
        max-width: min(32rem, 90vw);
        padding: 1rem;
        border: 1px solid rgba(128, 128, 128, 0.6);
        border-radius: 6px;
        background: Canvas;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      .maske h3 {
        margin: 0 0 0.8rem;
        font-size: 1rem;
      }
      .maskenknoepfe {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      select {
        display: block;
        width: min(40rem, 100%);
        padding: 0.3rem;
      }
    </style>
  </head>
  <body>
    <main id="wurzel"></main>
    <script type="module" src="./haupt.tsx"></script>
  </body>
</html>
