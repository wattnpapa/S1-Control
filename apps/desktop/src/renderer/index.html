<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'"
    />
    <title>S1-Control</title>
    <style>
      /* Die Schrift der taktischen Zeichen. Sie liegt im Paket
         (`apps/desktop/assets/tz/schrift/`, Apache-2.0) und nicht bei Google
         Fonts: Die Anwendung laeuft offline (02-ZIELBILD.md), und ein Zeichen
         mit fremder Schrift ist im Ausdruck ein anderes Zeichen. */
      @font-face {
        font-family: "Roboto Slab";
        font-weight: bold;
        font-style: normal;
        src: url("../../assets/tz/schrift/RobotoSlab-Bold.woff") format("woff");
      }

      /* Ein taktisches Zeichen steht inline im Dokument (siehe zeichen.tsx);
         die Groesse gibt der Aufrufer, das SVG traegt seine viewBox. */
      .tz {
        display: inline-block;
        line-height: 0;
      }
      .tz svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .tz-fehlt {
        line-height: 1.2;
        padding: 4px 6px;
        border: var(--rahmenbreite) dashed var(--rahmen);
        color: var(--text-leise);
        text-align: center;
        font-size: 0.92em;
      }

      /* Die Gestaltungsebene aus dem Entwurf
         (docs/v2/entwurf/oberflaeche/HANDOFF-OBERFLAECHE.md, Option 2a).
         Alles haengt an den Marken unter :root, damit ein Themewechsel an
         **einer** Stelle umschaltet: Eine Regel, die ihre Farbe selbst setzt,
         faellt im Nacht- oder Feldbild aus dem Bild. */
      :root {
        --navy-900: #1c2251;
        --navy-800: #14183a;
        --navy-600: #1a3fb0;
        --navy-300: #a9b0d4;
        --grund: #eef0f6;
        --karte: #ffffff;
        --rahmen: #c9cfe0;
        --rahmen-weich: #dde1ec;
        --zeile-alt: #f6f7fb;
        --kopf-bg: #e7eaf3;
        --zeile-gewaehlt: #eaedf7;
        --text: #14183a;
        --text-leise: #5c6484;
        --text-leiser: #8b93ad;
        --ok-bg: #e0f0e6;
        --ok-linie: #a8d3b8;
        --ok-text: #14652f;
        --warn-bg: #fbeccd;
        --warn-linie: #e3c987;
        --warn-text: #7a5c12;
        --err-bg: #f7dede;
        --err-linie: #dda9a9;
        --err-text: #8f1717;
        --neutral-bg: #eceef4;
        /* Einstiegszeile je Blatt: der Grund des Übungsstreifens aus
           HANDOFF-OBERFLAECHE.md (übung-streifen), ohne Streifen. */
        --einstieg-bg: #fbf5e2;
        --einstieg-linie: #d8c47a;
        --kopfband-bg: var(--navy-900);
        --kopfband-text: #ffffff;
        --kopfband-leise: var(--navy-300);
        --kopfband-gut: #8fe3a8;
        /* Bernstein und Rot auf dem Navy des Kopfbands (Zustandsmarke,
           Zähler am Reiter): die hellen Töne aus HANDOFF-OBERFLAECHE.md, weil
           --warn-text und --err-text für helle Karten gemacht sind. */
        --kopfband-warn: #f0c368;
        --kopfband-fehler: #ffa8a8;
        --kartenkante-farbe: var(--navy-800);
        --knopf-rahmen: var(--navy-900);
        --knopf-fuellung: var(--navy-900);
        --knopf-fuellung-text: #ffffff;
        --harke-linie: #000000;
        --gesperrt-bg: #e3e6ef;
        --gesperrt-text: #5c6484;
        --rahmenbreite: 1px;
        --schrift: 12px;
        --knopfhoehe: 31px;
        /* Der Monitor (M3.5, S4.1): fester Kontrast an der Wand, unabhängig
           vom Erscheinungsbild — nur „nacht" dimmt ihn auf Bernstein. */
        --monitor-grund: #000000;
        --monitor-text: #ffffff;
        --monitor-leise: rgba(255, 255, 255, 0.65);
        --monitor-linie: rgba(255, 255, 255, 0.28);
        --monitor-warn: #e3c06b;
        --monitor-leiste: #1a1a1a;
        /* Statuskanten der Funkplan-Kacheln (F4): die Statusfarben der
           dunklen Bilder („dunkel", „nacht"), weil der Monitor immer auf
           Schwarz steht — das Grün und Rot des hellen Bildes verschwänden
           dort. Bernstein ist `--monitor-warn`, Grau `--monitor-leise`. */
        --monitor-ok: #9ed17e;
        --monitor-fehler: #ffa8a8;
        --ui: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, Menlo, monospace;
        color-scheme: light;
        font-family: var(--ui);
      }

      /* „Dunkel" ist das Indigo-Bild aus erfassungsbogen.app: derselbe
         Aufbau, nur die Flaechen kehren sich um. */
      :root[data-theme="dunkel"] {
        --grund: #171a2e;
        --karte: #1e2240;
        --rahmen: #343a63;
        --rahmen-weich: #2a2f52;
        --zeile-alt: #232746;
        --kopf-bg: #262b4d;
        --zeile-gewaehlt: #2c3260;
        --text: #e6e8f6;
        --text-leise: #a9b0d4;
        --text-leiser: #7d85ad;
        --ok-bg: #1c3a28;
        --ok-linie: #2f6a45;
        --ok-text: #9ed17e;
        --warn-bg: #3a3016;
        --warn-linie: #6d5a24;
        --warn-text: #e3c987;
        --err-bg: #3d1f1f;
        --err-linie: #6d3434;
        --err-text: #ffa8a8;
        --neutral-bg: #232746;
        --einstieg-bg: #2a2614;
        --einstieg-linie: #6d5a24;
        --kartenkante-farbe: #6b74a8;
        --knopf-rahmen: #6b74a8;
        --knopf-fuellung: #3b4383;
        --harke-linie: #c3c8e4;
        --gesperrt-bg: #262b4d;
        --gesperrt-text: #9199c0;
        color-scheme: dark;
      }

      /* „Feld": 2-px-Raender, groessere Schrift, hohe Knoepfe — fuer
         Handschuhe und fuer Sonne auf dem Bildschirm. */
      :root[data-theme="feld"] {
        --grund: #e9ebf0;
        --einstieg-linie: #000000;
        --rahmen: #000000;
        --rahmen-weich: #000000;
        --text: #000000;
        --text-leise: #000000;
        --text-leiser: #333333;
        --kartenkante-farbe: #000000;
        --knopf-rahmen: #000000;
        /* Ein gesperrter Knopf darf im Feldbild nicht schwarz auf schwarz
           stehen: Der Rahmen ist hier ueberall schwarz, die Fuellung nicht. */
        --gesperrt-bg: #d5d8e0;
        --gesperrt-text: #4a4a4a;
        --rahmenbreite: 2px;
        --schrift: 14px;
        --knopfhoehe: 38px;
      }

      /* „Nacht": Bernstein auf Schwarz, kein weisser Grund. */
      :root[data-theme="nacht"] {
        --navy-900: #14120a;
        --navy-300: #c8a232;
        --grund: #0c0b06;
        --karte: #14120a;
        --rahmen: #3a3418;
        --rahmen-weich: #2a2410;
        --zeile-alt: #191509;
        --kopf-bg: #1c1809;
        --zeile-gewaehlt: #241f0c;
        --text: #e8dfae;
        --text-leise: #c8a232;
        --text-leiser: #8d7a34;
        --ok-bg: #1b2a14;
        --ok-linie: #3d5a2c;
        --ok-text: #9ed17e;
        --warn-bg: #2a2410;
        --warn-linie: #5a4c1e;
        --warn-text: #e0b84a;
        --err-bg: rgba(239, 68, 68, 0.26);
        --err-linie: #7a3535;
        --err-text: #ffa8a8;
        --neutral-bg: #191509;
        --einstieg-bg: #1c1809;
        --einstieg-linie: #5a4c1e;
        --kopfband-bg: #14120a;
        --kopfband-text: #f0e5b0;
        --kopfband-leise: #c8a232;
        --kopfband-gut: #9ed17e;
        --kopfband-warn: #e0b84a;
        --kopfband-fehler: #ffa8a8;
        --kartenkante-farbe: #c8a232;
        --knopf-rahmen: #5a4c1e;
        --knopf-fuellung: #c8a232;
        --knopf-fuellung-text: #14120a;
        --harke-linie: #c8a232;
        --gesperrt-bg: #241f0c;
        --gesperrt-text: #a58d3c;
        --monitor-text: #e8dfae;
        --monitor-leise: rgba(232, 223, 174, 0.65);
        --monitor-linie: rgba(200, 162, 50, 0.35);
        --monitor-warn: #e0b84a;
        --monitor-leiste: #14120a;
        color-scheme: dark;
      }

      /* `hidden` muss staerker sein als jede Anzeigeregel darunter: Ein
         ausgeblendetes Blatt bleibt sonst sichtbar, weil `.lagespalten`
         ein `display: flex` traegt. */
      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--grund);
        color: var(--text);
        font-size: var(--schrift);
      }
      .arbeitsplatz {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ---- Führungsharke (Entwurf, Option 3a) ---------------------------- */

      .fueorgkopf {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .fueorgkopf h2 {
        margin: 0;
      }
      .fueorgkopf .spaltengruppen {
        margin: 0 0 0 auto;
      }
      .fueorgflaeche {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .harke {
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        padding: 8px 0 16px;
      }
      /* Der Stamm ist die senkrechte Linie, der Querbalken die waagerechte.
         Beide 3 px schwarz — im Nachtbild bernstein, damit sie auf dem
         schwarzen Grund überhaupt stehen. */
      .harke .stamm {
        width: 3px;
        margin: 0 auto;
        background: var(--harke-linie);
      }
      /* Der Balken spannt ueber die ganze Reihe darunter — ohne `stretch`
         schrumpfte er in der zentrierten Spalte auf null Breite. */
      .harke .quer {
        height: 3px;
        align-self: stretch;
        background: var(--harke-linie);
      }
      .harke .reihe {
        display: grid;
        justify-items: center;
      }
      .harke .zelle {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 0;
        padding: 0 8px;
      }
      .harke .knoten {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .harke .knoten.aufgeloest {
        opacity: 0.55;
      }
      .harke .knoten.aufgeloest .name {
        text-decoration: line-through;
      }
      .harke .unterschrift,
      .einrichtungen .unterschrift {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 4px 0 2px;
        font-size: 10.5px;
        line-height: 1.35;
        color: var(--text-muted-2, var(--text-leise));
        text-align: center;
      }
      .harke .unterschrift .name {
        font-weight: 700;
        color: var(--text);
      }
      .harke .unterschrift .typ {
        color: var(--text-leiser);
      }
      .harke .unterschrift .zahlen,
      .einrichtungen .unterschrift {
        font-variant-numeric: tabular-nums;
      }
      /* Die Zeichen tragen ihre eigene Farbe (gelb mit schwarzem Rand) und
         folgen keinem Theme: Ein taktisches Zeichen ist genormt, und ein
         graues Zeichen wäre ein anderes. Im Nachtbild bekommt es einen
         schmalen Grund, damit der schwarze Rand nicht im Grund verschwindet. */
      :root[data-theme="nacht"] .tz,
      :root[data-theme="dunkel"] .tz {
        background: #d8d3c0;
        padding: 2px;
      }
      .einrichtungen {
        flex: 0 0 300px;
        border-left: var(--rahmenbreite) solid var(--rahmen);
        padding-left: 14px;
      }
      .einrichtungen h3 {
        margin: 0 0 9px;
        font: 400 0.84em/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-leise);
      }
      .einrichtungen ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .einrichtungen li {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .einrichtungen li .name {
        font-weight: 700;
        padding-top: 4px;
      }

      /* ---- Kopfband (Entwurf, Option 2a) -------------------------------- */

      .kopfband {
        background: var(--kopfband-bg);
        color: var(--kopfband-text);
        padding: 11px 20px 0;
      }
      .kopfband .zeile {
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 6px 0 9px;
      }
      .kopfband .marke {
        width: 44px;
        height: 30px;
        display: grid;
        place-items: center;
        background: var(--navy-600);
        border: 1px solid #6b74a8;
        color: #ffffff;
        font: 700 9px/1 var(--ui);
        letter-spacing: 0.08em;
      }
      /* Der Einsatz ist die Überschrift (Entwurf „Entlastung", 3.1); das
         Wortbild steht klein darunter, neben der Führungsstelle. */
      .kopfband .einsatztitel {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .kopfband h1 {
        margin: 0;
        font: 700 19px/1.1 var(--ui);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kopfband .einsatztitel .untertitel {
        font: 400 11.5px/1.2 var(--ui);
        color: var(--kopfband-leise);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kopfband .einsatztitel .abgeschlossen {
        color: var(--kopfband-warn);
        font-weight: 700;
      }
      .kopfband .kennzahl {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .kopfband .kennzahl .label {
        font: 400 11px/1 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--kopfband-leise);
      }
      .kopfband .kennzahl .wert {
        font-size: 30px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .kopfband .kennzahl.staerke {
        position: relative;
      }
      .kopfband .kennzahl .regelknopf {
        margin-left: 8px;
        min-height: 28px;
        padding: 2px 10px;
        background: transparent;
        border: 1px solid var(--kopfband-leise);
        border-radius: 4px;
        color: var(--kopfband-text);
        font: 400 11px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: none;
        cursor: pointer;
      }
      .kopfband .kennzahl .nebenwert {
        font-size: 12px;
        color: var(--kopfband-leise);
      }
      .kopfband .kennzahl .zaehlregel {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 20;
        margin-top: 6px;
        width: min(30rem, 86vw);
        padding: 10px 12px;
        background: var(--karte);
        color: var(--text);
        border: 1px solid var(--rahmen);
        border-radius: 6px;
        font: 400 14px/1.4 var(--sans, system-ui, sans-serif);
        letter-spacing: 0;
        text-transform: none;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      }
      .kopfband .kennzahl .zaehlregel .regelschliessen {
        display: block;
        margin: 8px 0 0 auto;
        min-height: 44px;
        padding: 6px 16px;
        border: 1px solid var(--rahmen);
        background: var(--karte);
        color: var(--text);
        font: 400 14px/1 var(--ui);
        cursor: pointer;
      }
      /* Schmal: Die Erklaerung haengt am Kopfband (nicht an der Kennzahl) und
         nutzt dessen volle Breite, damit sie nie rechts aus dem Bild laeuft. */
      @media (max-width: 900px) {
        .kopfband {
          position: relative;
        }
        .kopfband .kennzahl.staerke {
          position: static;
        }
        .kopfband .kennzahl .zaehlregel {
          left: 8px;
          right: 8px;
          width: auto;
          max-width: calc(100vw - 16px);
          box-sizing: border-box;
        }
      }
      @media (pointer: coarse) {
        .kopfband .kennzahl .regelknopf {
          min-height: 44px;
          min-width: 44px;
          padding: 6px 14px;
        }
      }
      /* Die Zustandsmarke: Zeichen und Wort, die Farbe kommt dazu und
         traegt nie allein (Entwurf „Entlastung", 6d). */
      .kopfband .zustandsmarke {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        min-height: var(--knopfhoehe);
        padding: 0 11px;
        border: var(--rahmenbreite) solid var(--kopfband-leise);
        color: var(--kopfband-gut);
        font: 400 12px/1 var(--ui);
        white-space: nowrap;
        cursor: help;
      }
      .kopfband .zustandsmarke.warnung {
        border-color: var(--kopfband-warn);
        color: var(--kopfband-warn);
      }
      .kopfband .zustandsmarke.fehler {
        border-color: var(--kopfband-fehler);
        color: var(--kopfband-fehler);
      }
      /* Das Fenstermenü „⋯": rechts aussen; ohne Zustandsmarke (kein
         Einsatz) schiebt es sich selbst dorthin. */
      .kopfband .fenstermenue {
        position: relative;
        margin-left: auto;
      }
      .kopfband .zustandsmarke + .fenstermenue {
        margin-left: 0;
      }
      .kopfband .fenstermenueknopf {
        width: var(--knopfhoehe);
        height: var(--knopfhoehe);
        padding: 0;
        border: var(--rahmenbreite) solid var(--kopfband-text);
        background: transparent;
        color: var(--kopfband-text);
        font: 700 17px/1 var(--ui);
      }
      .kopfband .fenstermenueknopf[aria-expanded="true"] {
        background: var(--kopfband-text);
        color: var(--kopfband-bg);
      }
      /* Klappmenüs (Klappmenue.tsx): Fenstermenü, „Einheit anlegen ▾",
         „Spalten ▾", „⋯" an der Baumzeile und die Kontextmenüs. Eckig, mit
         Schatten, das Kürzel rechts in Mono (Entwurf „Entlastung", 6e). */
      .klappmenue {
        position: relative;
        display: inline-block;
      }
      .klappmenueliste,
      .monitorauswahl {
        z-index: 30;
        display: flex;
        flex-direction: column;
        min-width: 250px;
        max-width: calc(100vw - 16px);
        padding: 4px 0;
        box-sizing: border-box;
        background: var(--karte);
        color: var(--text);
        border: var(--rahmenbreite) solid var(--rahmen);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        text-align: left;
      }
      .klappmenue > .klappmenueliste,
      .monitorauswahl {
        position: absolute;
        top: 100%;
        left: 0;
        margin: 6px 0 0;
      }
      .fenstermenue > .klappmenueliste,
      .monitorauswahl,
      .klappmenue.rechts > .klappmenueliste {
        left: auto;
        right: 0;
      }
      .klappmenueliste [role^="menuitem"],
      .monitorauswahl button {
        position: relative;
        display: flex;
        align-items: baseline;
        gap: 12px;
        width: 100%;
        height: auto;
        min-height: 34px;
        padding: 9px 14px 9px 32px;
        border: 0;
        background: transparent;
        color: var(--text);
        font: 400 max(13px, var(--schrift)) / 1.2 var(--ui);
        text-align: left;
        white-space: nowrap;
      }
      .monitorauswahl button {
        padding-left: 14px;
      }
      .klappmenueliste [role^="menuitem"]:hover,
      .klappmenueliste [role^="menuitem"]:focus-visible,
      .monitorauswahl button:hover,
      .monitorauswahl button:focus-visible {
        background: var(--zeile-gewaehlt);
      }
      .klappmenueliste [role^="menuitem"]:focus-visible,
      .monitorauswahl button:focus-visible {
        outline: var(--rahmenbreite) solid var(--knopf-rahmen);
        outline-offset: -2px;
      }
      .klappmenueliste [aria-checked="true"] {
        font-weight: 700;
      }
      .klappmenueliste [aria-checked="true"]::before {
        content: "✓";
        position: absolute;
        left: 12px;
      }
      /* Was gerade nicht geht, steht grau da und nennt den Grund im Titel. */
      .klappmenueliste [aria-disabled="true"] {
        color: var(--text-leiser);
        cursor: default;
      }
      .klappmenueliste [role^="menuitem"].rot:not([aria-disabled="true"]) {
        color: var(--err-text);
      }
      .klappmenueliste .kurz {
        margin-left: auto;
        color: var(--text-leiser);
        font: 400 11px/1 var(--mono);
      }
      .klappmenueliste .titel,
      .monitorauswahl .titel {
        display: block;
        margin: 0;
        padding: 7px 14px 5px;
        color: var(--text-leise);
        font: 400 10px/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .klappmenueliste .hinweis {
        display: block;
        max-width: 22rem;
        padding: 7px 14px;
        color: var(--text-leise);
        white-space: normal;
      }
      .klappmenueliste hr,
      .monitorauswahl hr {
        width: 100%;
        margin: 4px 0;
        border: 0;
        border-top: var(--rahmenbreite) solid var(--rahmen-weich);
      }
      .klappmenueliste form {
        margin: 0;
      }
      /* Das Kontextmenü steht an der Mausposition (Marken aus Klappmenue.tsx). */
      .kontextmenue {
        position: fixed;
        left: var(--menue-x, 0);
        top: var(--menue-y, 0);
        z-index: 90;
      }
      /* Die Reiterzeile schliesst das Kopfband nach unten ab: Der gewaehlte
         Reiter traegt seine Marke dort, wo die Arbeitsflaeche beginnt. */
      .kopfband .reiter {
        display: flex;
        gap: 2px;
      }
      .kopfband .reiter button {
        height: auto;
        padding: 7px 13px 6px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--kopfband-leise);
        font: 400 13px/1.2 var(--ui);
      }
      .kopfband .reiter button[aria-selected="true"] {
        color: var(--kopfband-text);
        font-weight: 700;
        border-bottom-color: var(--kopfband-text);
      }
      .kopfband .reiter .zaehler {
        margin-left: 6px;
        color: var(--kopfband-warn);
        font-variant-numeric: tabular-nums;
      }

      /* ---- Arbeitsfläche ------------------------------------------------- */

      main {
        flex: 1;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      /* Jede Ansicht der Arbeitsfläche ist eine Karte: eckig, 1-px-Rahmen und
         eine 3-px-Oberkante, an der das Auge die Blöcke trennt. */
      /* Die Lage ist keine Karte, sondern die Flaeche, auf der die Karten
         liegen: Baum, Einheiten, Ausgaben, Nebenblaetter, Tagebuch. */
      main > section.lage {
        background: transparent;
        border: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      main > section,
      .lagespalten > .baum,
      .lagespalten > .einheiten,
      .lage > .ausgaben,
      .lage > .blaetter,
      .lage > .tagebuch,
      .karte {
        background: var(--karte);
        border: var(--rahmenbreite) solid var(--rahmen);
        border-top: 3px solid var(--kartenkante-farbe);
        padding: 13px;
      }
      h2 {
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 9px;
      }
      h3 {
        font-size: 12.5px;
        font-weight: 700;
      }
      label {
        display: block;
        margin-bottom: 9px;
        color: var(--text-leise);
        font-size: 0.92em;
      }
      input,
      select,
      textarea {
        box-sizing: border-box;
        display: block;
        width: min(30rem, 100%);
        margin-top: 4px;
        padding: 6px 8px;
        background: var(--karte);
        color: var(--text);
        border: var(--rahmenbreite) solid var(--rahmen);
        border-radius: 0;
        font: 400 var(--schrift) / 1.35 var(--ui);
      }
      input:focus-visible,
      select:focus-visible {
        outline: 0;
        border: 2px solid var(--knopf-rahmen);
      }
      /* Knöpfe: gefüllt ist der Hauptweg, umrandet der Nebenweg. */
      button {
        height: var(--knopfhoehe);
        padding: 0 13px;
        border: var(--rahmenbreite) solid var(--knopf-rahmen);
        border-radius: 0;
        background: var(--karte);
        color: var(--text);
        font: 400 var(--schrift) / 1 var(--ui);
        cursor: pointer;
      }
      button.haupt {
        background: var(--knopf-fuellung);
        border-color: var(--knopf-fuellung);
        color: var(--knopf-fuellung-text);
        font-weight: 700;
      }
      button:disabled {
        background: var(--gesperrt-bg);
        border-color: var(--knopf-rahmen);
        color: var(--gesperrt-text);
        cursor: default;
      }

      /* Die Statuszeile steht unten und bleibt dort: Sie ist die einzige
         Auskunft ueber Stand und Erreichbarkeit und darf nicht wegscrollen. */
      .statuszeile {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        min-height: 30px;
        padding: 0 14px;
        background: var(--karte);
        border-top: 1px solid var(--rahmen);
        font-size: 0.96em;
      }
      /* Rechts: die Bestaetigung des letzten eigenen Schritts und daneben
         „Rueckgaengig" mit seinem Namen (Entwurf „Entlastung", 6e). Die
         Bestaetigung bleibt als leerer Live-Bereich stehen und schiebt beide
         an den rechten Rand. */
      .statuszeile .bestaetigung {
        margin-left: auto;
        color: var(--ok-text);
        font-weight: 600;
      }
      .statuszeile .ruecknahme {
        height: auto;
        min-height: 24px;
        padding: 2px 0;
        border: 0;
        background: transparent;
        color: var(--text);
        font-family: var(--ui);
        font-size: inherit;
        font-weight: 600;
        line-height: 1.2;
        text-align: left;
      }
      .statuszeile .ruecknahme:not(:disabled):hover {
        text-decoration: underline;
      }
      .statuszeile .ruecknahme:disabled {
        background: transparent;
        color: var(--text-leiser);
        font-weight: 400;
      }
      /* Zustandsmarken: Status in der Tabelle, Ampeln im Eingangskorb. Farbe
         **und** Wort — eine Auskunft, die nur an der Farbe haengt, faellt bei
         Rotschwaeche aus. */
      .marke-zustand {
        display: inline-block;
        padding: 2px 6px;
        border: var(--rahmenbreite) solid var(--neutral-bg);
        background: var(--neutral-bg);
        color: var(--text-leise);
        font: 700 0.82em/1.3 var(--ui);
        letter-spacing: 0.04em;
      }
      .marke-zustand.ok {
        background: var(--ok-bg);
        border-color: var(--ok-linie);
        color: var(--ok-text);
      }
      .marke-zustand.warn {
        background: var(--warn-bg);
        border-color: var(--warn-linie);
        color: var(--warn-text);
      }
      .marke-zustand.ruhe {
        background: var(--neutral-bg);
        border-color: var(--neutral-linie, var(--neutral-bg));
        color: var(--neutral-text, inherit);
        font-style: italic;
      }
      .marke-zustand.fehler {
        background: var(--err-bg);
        border-color: var(--err-linie);
        color: var(--err-text);
      }

      .warnung {
        color: var(--warn-text);
      }
      .fehler {
        color: var(--err-text);
      }
      .fehlerbild {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 14px 14px 0;
        padding: 9px 13px;
        background: var(--err-bg);
        border: var(--rahmenbreite) solid var(--err-linie);
        color: var(--err-text);
      }
      .hinweistext {
        color: var(--text-leise);
        font-size: 0.92em;
        line-height: 1.45;
      }
      .hinweise ul {
        margin: 0;
        padding-left: 1.2rem;
      }

      /* Die Einstiegszeile je Blatt (Einstiegszeile.tsx): unter dem Kopfband,
         bis „Verstanden" (Entwurf „Entlastung", 3.6). */
      .einstiegszeile {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 8px 14px;
        background: var(--einstieg-bg);
        border-bottom: var(--rahmenbreite) solid var(--einstieg-linie);
        color: var(--text);
        font-size: 0.96em;
        line-height: 1.4;
      }
      .einstiegszeile p {
        flex: 1 1 24rem;
        margin: 0;
      }
      .einstiegszeile .nebenwert {
        color: var(--text-leise);
      }
      .einstiegszeile button {
        flex: none;
        font-weight: 700;
      }

      /* ---- Das Lagebild (M3) ------------------------------------------- */

      /* Der Kopf des Baums: Titel links, der eine Hauptknopf rechts
         (Entwurf „Entlastung", 3.4). */
      .baumkopf {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 0.5rem;
      }
      .baumkopf h2 {
        margin: 0 auto 0 0;
      }
      /* Einmal die Spaltenkoepfe der Zahlen statt „Einh." in jeder Zeile. */
      .baumspalten {
        margin: 0;
        padding: 4px 0.4rem 3px;
        text-align: right;
        color: var(--text-leise);
        font: 400 10px/1 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .lagespalten {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: flex-start;
      }
      /* Der Baum steht fest und schmal (Entwurf: 266 px): Er ist die
         Gliederung und nicht der Inhalt; die Breite gehoert der Tabelle. */
      .baum {
        flex: 0 0 300px;
        min-width: 300px;
        /* Sichtbar und nicht abgeschnitten: Das Menue „⋯" der gewaehlten
           Zeile klappt ueber den Rand der Karte. Die Namen kuerzen sich in
           der Zeile selbst (.baumzeile .name). */
        overflow: visible;
      }
      /* Im Feldbild ist die Schrift groesser — der Baum bekommt die Breite,
         die er dafuer braucht, statt jeden zweiten Namen zu kuerzen. */
      :root[data-theme="feld"] .baum {
        flex-basis: 340px;
        min-width: 340px;
      }
      .baumliste {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      /* Zeile und „⋯" nebeneinander: Das Menue ist ein eigener Knopf, kein
         Knopf im Knopf. */
      .baumliste li {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .baumliste li > .baumzeile {
        flex: 1 1 auto;
        min-width: 0;
      }
      /* „Alle Bereiche" ist keine Abteilung, sondern die Aufhebung der Wahl:
         leiser Grund und ein Strich darunter. */
      .baum .alle {
        margin-bottom: 2px;
        border-bottom: var(--rahmenbreite) solid var(--rahmen-weich);
      }
      .baum .alle .baumzeile:not(.gewaehlt) {
        background: var(--zeile-alt);
        color: var(--text-leise);
      }
      .baum .zeilenmenue > button {
        width: 26px;
        height: 24px;
        padding: 0;
        font: 700 13px/1 var(--ui);
      }
      .baum .zeilenmenue > button[aria-expanded="true"] {
        background: var(--knopf-fuellung);
        color: var(--knopf-fuellung-text);
      }
      .baumfuss {
        margin-top: 8px;
        padding-top: 8px;
        border-top: var(--rahmenbreite) solid var(--rahmen-weich);
      }
      /* Name links, Zahlen rechts, und der Name gibt nach: In einer schmalen
         Spalte ist die Stelle, an der gekuerzt werden darf, der Name — die
         Staerke daneben ist der Grund, aus dem die Zeile ueberhaupt gelesen
         wird. */
      .baumzeile {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        background: none;
        border: 1px solid transparent;
        padding: 0.2rem 0.4rem;
        font: inherit;
        cursor: pointer;
      }
      .baumzeile:hover {
        border-color: var(--rahmen);
      }
      /* Die gewaehlte Zeile ist gefuellt und nicht nur umrandet: Sie ist der
         Bezug, auf den sich die ganze rechte Seite beruft. */
      .baumzeile.gewaehlt {
        background: var(--knopf-fuellung);
        border-color: var(--knopf-fuellung);
        color: var(--knopf-fuellung-text);
        font-weight: 700;
      }
      /* Das Zeichen der Zeile: feste Breite, damit die Namen darunter in
         einer Flucht stehen — eine Spalte, die mal 22 und mal 0 px breit ist,
         zerreisst den Baum optisch. */
      .baumzeile .baumzeichen {
        flex: 0 0 26px;
        line-height: 0;
      }
      .baumzeile .name {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Der Typ steht als Kuerzel und in Mono: „EINSATZORT" ausgeschrieben
         nimmt in einer 288-px-Spalte den Platz des Namens weg. */
      .baumzeile .typ {
        flex: 0 3 auto;
        font: 400 0.8em/1 var(--mono);
        color: var(--text-leiser);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 7em;
      }
      .baumzeile.gewaehlt .typ {
        color: inherit;
      }
      /* Die Zahlen stehen rechts und in Tabellenziffern: Wer Staerken
         vergleicht, liest Spalten und keine Woerter. */
      .baumzeile .zahlen {
        margin-left: auto;
        white-space: nowrap;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.85em;
      }
      .schalter {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        margin: 0;
        font-size: 0.85rem;
      }
      .schalter input {
        display: inline;
        width: auto;
      }
      /* Der Grund traegt die Maske: Er deckt das Fenster ganz ab, legt sich
         mit `z-index` ueber jeden klebenden Spaltenkopf und nimmt die Klicks
         auf, die nicht in die Maske gehoeren. Ohne ihn entschied die
         Reihenfolge im Dokument, wer oben liegt. */
      .maskengrund {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
        /* Der Grund dunkelt ab statt zu verdecken: Die Lage dahinter bleibt
           lesbar, aber sie ist erkennbar nicht mehr an der Reihe. */
        background: rgba(9, 20, 48, 0.28);
      }
      /* Die Maske liegt ueber der Ansicht, damit der Blick nicht springt,
         und sie ist schmal: Ein Formular, das die ganze Breite fuellt,
         zwingt das Auge bei jeder Zeile quer ueber den Bildschirm. */
      .maske {
        box-sizing: border-box;
        min-width: 22rem;
        max-width: min(32rem, 90vw);
        /* Eine lange Maske scrollt in sich und nicht aus dem Fenster heraus. */
        max-height: 100%;
        overflow-y: auto;
        padding: 16px;
        border: var(--rahmenbreite) solid var(--rahmen);
        border-top: 3px solid var(--kartenkante-farbe);
        background: var(--karte);
        /* Der einzige Schatten im Programm: Er sagt, dass diese Maske vor der
           Ansicht liegt und den Fokus hat. */
        box-shadow: 0 14px 40px rgba(9, 20, 48, 0.22);
      }
      .maske h3 {
        margin: 0 0 0.8rem;
        font-size: 1rem;
      }
      /* Die Wegwahl einer Maske: Radioknöpfe in einer Zeile, ohne Rahmen. */
      .wegwahl {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        margin: 0 0 0.6rem;
        padding: 0;
        border: 0;
      }
      .wegwahl legend {
        font-size: 0.8rem;
        color: var(--text-gedaempft, inherit);
        padding: 0;
        margin-bottom: 0.2rem;
      }
      .wegwahl label {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }
      .maskenknoepfe {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      /* ---- Die Vorlagenwahl der Anlegemaske ------------------------------ */

      /* Eine Liste statt eines Auswahlfelds: Neunzig Vorlagen in einem
         Aufklappmenue liest niemand. Sie ist kurz und scrollt in sich, damit
         Herkunft und Abschnitt darunter ohne Suchen erreichbar bleiben. */
      .vorlagenfilter {
        display: flex;
        gap: 0.6rem;
      }
      .vorlagenfilter label {
        flex: 1;
      }
      .vorlagenliste {
        list-style: none;
        margin: 0 0 0.6rem;
        padding: 0;
        max-height: 12rem;
        overflow-y: auto;
        border: var(--rahmenbreite) solid var(--rahmen);
      }
      .vorlagenliste li {
        padding: 2px 6px;
        cursor: pointer;
        line-height: 1.35;
      }
      .vorlagenliste li[data-markiert="ja"] {
        outline: 2px solid var(--kartenkante-farbe);
        outline-offset: -2px;
      }
      .vorlagenliste li[aria-selected="true"] {
        background: var(--kopf-bg);
        font-weight: 700;
      }
      .vorlagenmerkmal {
        display: block;
        font-size: 0.85em;
        color: var(--text-leise);
      }
      .vorlagengewaehlt {
        margin: 0 0 0.5rem;
      }

      /* ---- Die Zeichenwahl (§5.3, freies Piktogramm) --------------------- */

      /* Breiter als eine gewoehnliche Maske: Eine Kachelwand in 22 rem zeigt
         zwei Zeichen nebeneinander, und wer waehlt, will vergleichen. */
      .maske:has(.zeichenwahl) {
        min-width: min(34rem, 90vw);
        max-width: min(48rem, 92vw);
      }
      .zeichenwahlkopf {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        align-items: flex-end;
      }
      .zeichenwahlkopf label {
        margin-bottom: 0;
      }
      .zeichenwahlkopf select,
      .zeichenwahlkopf input {
        width: min(16rem, 100%);
      }
      /* Die Wand scrollt in sich: Vierzig Kacheln sind laenger als jeder
         Bildschirm, und eine Maske, die mitwaechst, schiebt ihre Knoepfe aus
         dem Bild. */
      .zeichenkacheln {
        list-style: none;
        margin: 0.8rem 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 6px;
        max-height: 46vh;
        overflow-y: auto;
        border: var(--rahmenbreite) solid var(--rahmen);
        padding: 6px;
      }
      .zeichenkachel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 100%;
        height: 100%;
        padding: 6px 4px;
        background: none;
        border: 1px solid transparent;
        text-align: center;
        cursor: pointer;
      }
      .zeichenkachel:hover {
        background: var(--zeile-alt);
      }
      .zeichenkachel.gewaehlt {
        background: var(--zeile-gewaehlt);
        border-color: var(--rahmen);
      }
      .zeichenkachel .kachelbild {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
      }
      /* Die erste Kachel traegt kein Bild, sondern den Rueckweg zur
         Ableitung — sie soll trotzdem so hoch sein wie die anderen. */
      .zeichenkachel .kachelleer {
        font-size: 0.8em;
        color: var(--text-leise);
        border: 1px dashed var(--rahmen);
        width: 44px;
        line-height: 1.2;
      }
      /* Zwei Zeilen Titel, dann Schluss: Ein Titel, der die Kachel auf die
         doppelte Hoehe treibt, verschiebt die ganze Reihe. */
      .zeichenkachel .kacheltitel {
        font-size: 0.78em;
        line-height: 1.25;
        color: var(--text-leise);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .zeichenkachel.gewaehlt .kacheltitel {
        color: var(--text);
      }
      select {
        display: block;
        width: min(40rem, 100%);
        padding: 0.3rem;
      }

      /* ---- Die Einheitentabelle (M3.2) ---------------------------------- */

      .einheiten {
        flex: 3 1 40rem;
        min-width: 0;
      }
      /* Ein Kopf: Titel mit Zahl, der Hauptknopf, rechts Suche und „Spalten"
         (Entwurf „Entlastung", 3.5). */
      .einheitenkopf {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem 10px;
        margin-bottom: 0.5rem;
      }
      .einheitenkopf h2 {
        margin: 0 0.5rem 0 0;
      }
      .einheitenkopf h2 small {
        margin-left: 4px;
        color: var(--text-leise);
        font-size: 0.86em;
        font-weight: 400;
      }
      .einheitenkopf .spaltenmenue {
        flex: none;
      }
      /* Die Suche steht rechts und ist breit genug fuer den Platzhalter:
         Gesucht wird nach Bezeichnung, Organisation, Ort und Kennzeichen. */
      .suchfeld {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 0 auto;
        text-transform: none;
        letter-spacing: 0;
      }
      .suchfeld input {
        display: inline;
        width: 17rem;
        margin-top: 0;
      }
      /* Die Spaltengruppen sind ein Umschalter und keine Liste von
         Kaestchen: Fuenf Haken in Versalien ueber einer Tabelle lesen sich
         wie eine zweite Kopfzeile. */
      .spaltengruppen {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        margin: 9px 0;
        border: var(--rahmenbreite) solid var(--rahmen);
        width: fit-content;
      }
      .spaltengruppen button {
        border: 0;
        border-left: var(--rahmenbreite) solid var(--rahmen);
        background: var(--karte);
        color: var(--text-leise);
        font-size: 0.92em;
      }
      .spaltengruppen button:first-child {
        border-left: 0;
      }
      .spaltengruppen button[aria-pressed="true"] {
        background: var(--kopf-bg);
        color: var(--text);
        font-weight: 700;
      }
      /* Die Filterzeile (Statusleiste.tsx): Marken mit Zahl, als Filter
         anklickbar. Sie steht zwischen Kopf und Tabelle, weil sie die Zeilen
         bestimmt. */
      .feldfehler {
        display: block;
        margin-top: 2px;
        font-size: 0.85em;
        color: var(--err-text);
      }
      input[aria-invalid="true"] {
        border-color: var(--err-linie);
      }
      .statusfilter {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 0 0 9px;
      }
      /* Die Filterzeile: die einzige Zeile zwischen Kopf und Tabelle. Links
         „Filter" klein in Mono, damit die Chips als Filter lesbar sind (Audit
         P2-2); rechts, was das Menue „Spalten" gerade eingestellt hat. */
      .filterzeile {
        padding: 6px 0;
        border-top: var(--rahmenbreite) solid var(--rahmen-weich);
      }
      .statusfilter-titel {
        margin-right: 4px;
        color: var(--text-leise);
        font: 400 10px/1 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .filterzeile .filterzustand {
        margin-left: auto;
        color: var(--text-leise);
        font-size: 0.92em;
      }
      .statusfilter button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 6px 2px 2px;
        border: var(--rahmenbreite) solid var(--rahmen);
        background: var(--karte);
        color: var(--text);
      }
      .statusfilter button[aria-pressed="true"] {
        border-color: var(--text);
        box-shadow: inset 0 0 0 1px var(--text);
      }
      .statusfilter-zahl {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      /* Die Kopfzeile eines Bereichs trägt den Kopfgrund wie die Summenzeile:
         Sie ist Zwischensumme und keine Einheit. */
      .einheiten tbody tr.bereichskopf th,
      .einheiten tbody tr.bereichskopf td {
        background: var(--kopf-bg);
        font-weight: 700;
        border-top: var(--rahmenbreite) solid var(--rahmen);
      }
      .einheiten tbody tr.bereichskopf:hover {
        background: none;
      }
      .einheiten tr.bereichskopf.zaehlt-nicht th,
      .einheiten tr.bereichskopf.zaehlt-nicht td {
        font-weight: 400;
        font-style: italic;
      }
      .einheiten tr.bereichskopf .nebenwert {
        font-weight: 400;
        font-size: 0.85em;
        color: var(--text-leise);
      }
      .spaltengruppen button:disabled[aria-pressed="true"] {
        background: var(--kopf-bg);
        color: var(--text-leise);
      }
      /* Die Tabelle darf breiter sein als das Fenster: Die Excel hat 48
         Spalten, und wer die Kostenuebersicht zuschaltet, will scrollen und
         nicht umbrechen. Der Rahmen scrollt, nicht die Seite. */
      .tabellenrahmen {
        overflow-x: auto;
        border: 1px solid var(--rahmen);
      }
      .einheiten table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      /* Die Zeilen bleiben einzeilig: Die Tabelle ist ein Vergleich ueber
         Zeilen hinweg, und umbrechende Zellen verschieben jede Zeile
         gegeneinander. Die Excel hat 48 Spalten; wer Ressourcen, Logistik
         oder Kosten zuschaltet, scrollt waagerecht — der Rahmen scrollt,
         nicht die Seite. */
      .einheiten th,
      .einheiten td {
        border-bottom: 1px solid var(--rahmen-weich);
        padding: 6px 8px;
        text-align: left;
        white-space: nowrap;
      }
      /* Spaltenkoepfe in Mono und Versalien: Sie sind Beschriftung und keine
         Aussage, und sie sollen sich von den Werten darunter unterscheiden. */
      .einheiten thead th {
        position: sticky;
        top: 0;
        background: var(--kopf-bg);
        border-bottom: var(--rahmenbreite) solid var(--rahmen);
        font: 400 0.84em/1.4 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-leise);
      }
      .einheiten tbody tr:hover {
        background: var(--zeile-alt);
      }
      .einheiten tbody tr.markiert {
        background: var(--zeile-gewaehlt);
      }
      .einheiten tbody tr.gewaehlt th[scope="row"] {
        font-weight: 700;
      }
      /* Eine entfernte Einheit bleibt sichtbar (§5.4.5) und ist durchgestrichen:
         Sie zaehlt nicht mehr, ist aber nicht fort. */
      .einheiten tbody tr.entfernt {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .einheiten th.zahl,
      .einheiten td.zahl {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      /* Die Summenzeile traegt den Kopfgrund: Sie gehoert zur Tabelle und
         nicht zu den Zeilen darueber. */
      .einheiten tfoot th,
      .einheiten tfoot td {
        background: var(--kopf-bg);
        font-weight: 700;
        border-top: var(--rahmenbreite) solid var(--rahmen);
      }
      /* Die Auswahlleiste (Einheitenauswahl.tsx): am Fuss der Karte, sobald
         eine Zeile gewaehlt ist, in den Farben des Kopfbands (Entwurf
         „Entlastung", 6c). Sie klebt unten im Fenster, solange die Tabelle
         im Bild ist: Wer weit unten waehlt, muss nicht zurueckscrollen. */
      .auswahlleiste {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        margin-top: 8px;
        padding: 7px 13px;
        background: var(--kopfband-bg);
        color: var(--kopfband-text);
        border: var(--rahmenbreite) solid var(--kopfband-bg);
      }
      .auswahlleiste .auswahlzahl {
        margin-right: 8px;
      }
      .auswahlleiste button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: auto;
        min-height: 27px;
        padding: 0 10px;
        border: var(--rahmenbreite) solid var(--kopfband-leise);
        background: transparent;
        color: var(--kopfband-text);
        font-size: 0.96em;
      }
      .auswahlleiste button:hover:not([aria-disabled="true"]) {
        background: var(--kopfband-text);
        color: var(--kopfband-bg);
      }
      .auswahlleiste button[aria-disabled="true"] {
        color: var(--kopfband-leise);
        border-style: dashed;
        cursor: default;
      }
      .auswahlleiste .kurz {
        color: var(--kopfband-leise);
        font: 400 10px/1 var(--mono);
      }
      /* „Entfernen“ ist folgenreich: Warnfarbe und Abstand zu den Nachbarn,
         damit der Griff daneben nicht dort landet. */
      .auswahlleiste button.entfernen {
        margin-left: 14px;
        border-color: var(--kopfband-fehler);
        color: var(--kopfband-fehler);
      }
      .auswahlleiste .auswahlsperre {
        color: var(--kopfband-warn);
      }
      .auswahlleiste .auswahlschluss {
        margin-left: auto;
        color: var(--kopfband-leise);
        font-size: 0.92em;
      }
      .einheiten td.berechnet {
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }
      /* Eine umstrittene Zelle wird markiert und nicht still ueberschrieben —
         die sichtbare Seite von §3.8. Farbe **und** Zeichen: Eine Auskunft,
         die nur an der Farbe haengt, faellt bei Rotschwaeche aus. */
      .einheiten td.umstritten {
        background: var(--warn-bg);
      }
      /* Die offene Zelle traegt einen 2-px-Fokusrahmen: Wer im Feld tippt,
         muss ohne Suchen sehen, welche Zelle seine Eingabe nimmt. */
      .einheiten td.bearbeitet {
        outline: 2px solid var(--knopf-rahmen);
        outline-offset: -2px;
      }
      .einheiten td.bearbeitet input,
      .einheiten td.bearbeitet select {
        display: block;
        width: 12rem;
        margin: 0;
        padding: 2px 4px;
        font: inherit;
      }
      /* Einheitentabelle: Abschnitt und Bezeichnung bleiben beim waagerechten
         Scrollen links stehen, Status folgt direkt danach. Ohne Namen ist eine
         Statusmarke keine Auskunft. */
      .einheiten th[scope="row"],
      .einheiten thead th:first-child {
        position: sticky;
        left: 0;
        z-index: 2;
        box-sizing: border-box;
        width: 9rem;
        min-width: 9rem;
        max-width: 9rem;
        overflow: hidden;
        text-overflow: ellipsis;
        background: var(--karte);
      }
      .einheiten thead th:first-child {
        z-index: 3;
        background: var(--kopf-bg);
      }
      /* Summenzeilen: Beschriftung und Zahlen kleben gemeinsam links im Bild,
         unabhaengig von der Scrollposition; der volle Name bricht um statt
         abgeschnitten zu werden. */
      .einheiten tfoot th[scope="row"] {
        position: static;
        width: auto;
        min-width: 0;
        max-width: none;
        overflow: visible;
        text-align: left;
        background: var(--kopf-bg);
      }
      .einheiten .summeninhalt {
        position: sticky;
        left: 0;
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 14px;
        width: max-content;
        max-width: calc(100vw - 2rem);
        padding: 2px 0;
        font-variant-numeric: tabular-nums;
      }
      .einheiten .summentitel {
        flex: 0 1 auto;
        white-space: normal;
      }
      .einheiten .summengesamt::before {
        content: "= ";
        font-weight: 400;
      }
      .einheiten td.namensspalte,
      .einheiten thead th.namensspalte {
        position: sticky;
        left: 9rem;
        z-index: 2;
        background: var(--karte);
        box-shadow: 1px 0 0 var(--rahmen);
      }
      .einheiten thead th.namensspalte {
        z-index: 3;
        background: var(--kopf-bg);
      }
      .einheiten tbody tr.markiert th[scope="row"],
      .einheiten tbody tr.markiert td.namensspalte {
        background: var(--zeile-gewaehlt);
      }
      /* Ohne Spalte Abschnitt (Gliederung oder gewaehlter Abschnitt) klebt
         die Bezeichnung selbst am linken Rand. */
      .einheiten table.ohne-abschnitt td.namensspalte,
      .einheiten table.ohne-abschnitt thead th.namensspalte {
        left: 0;
      }
      .einheiten tbody tr.gewaehlt td.namensspalte {
        font-weight: 700;
      }
      /* Status-Chip als Knopf: Er sieht bedienbar aus und ist es (ein Tipp
         öffnet die Auswahl); Zielgröße für Handschuhe. */
      .einheiten button.statuschip {
        min-height: 36px;
        min-width: 44px;
        cursor: pointer;
        font-family: inherit;
      }
      .einheiten button.statuschip::after {
        content: " ▾";
      }
      .einheiten td.auswahlzelle select {
        display: inline-block;
        min-height: 36px;
      }
      .einheiten .auswahlknoepfe {
        display: inline-flex;
        gap: 6px;
        margin-left: 6px;
        vertical-align: middle;
      }
      .einheiten .auswahlknoepfe button {
        min-height: 44px;
        min-width: 44px;
      }
      /* Beendet oder archiviert: Der Grund steht direkt über der Tabelle. */
      .einheiten .sperrhinweis {
        margin: 6px 0;
        padding: 8px 10px;
        border: 1px solid var(--rahmen);
        border-left: 4px solid var(--warn-linie);
        color: var(--warn-text);
        background: var(--warn-bg);
        font-weight: 600;
      }
      .einheiten button.statuschip:disabled {
        cursor: not-allowed;
        opacity: 0.7;
      }
      @media (pointer: coarse) {
        .einheiten button.statuschip {
          min-height: 44px;
        }
      }
      /* Handy: Nur die Bezeichnung bleibt links stehen (Abschnitt scrollt weg,
         ist schmal), der Status folgt unmittelbar und ist vollständig lesbar
         (bricht bei Bedarf auf zwei Zeilen). Das Auswahlblatt (unten) hat
         seine eigene, weitere Bedingung. */
      @media (max-width: 700px) {
        .einheiten th[scope="row"],
        .einheiten thead th:first-child {
          position: static;
          width: 4.5rem;
          min-width: 4.5rem;
          max-width: 4.5rem;
        }
        .einheiten td.namensspalte,
        .einheiten thead th.namensspalte {
          left: 0;
          max-width: 8.5rem;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .einheiten td.statusspalte {
          white-space: normal;
          min-width: 7rem;
        }
        .einheiten button.statuschip {
          min-height: 44px;
          white-space: normal;
          text-align: left;
          line-height: 1.15;
        }
      }
      /* Das Blatt gilt nicht nur am Handy, sondern bei jeder schmalen, flachen
         (Querformat) oder grob bedienten (Touch) Anzeige: Dieselbe Bedingung
         steht als SCHMAL in Einheitenzelle.tsx. */
      @media (max-width: 900px), (pointer: coarse), (max-height: 500px) {
        .auswahlgrund {
          position: fixed;
          inset: 0;
          z-index: 60;
          display: flex;
          align-items: flex-end;
          background: rgba(0, 0, 0, 0.45);
        }
        .auswahlblatt {
          box-sizing: border-box;
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          width: 100%;
          padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
          background: var(--karte);
          color: var(--text);
          border-top: 3px solid var(--rahmen);
        }
        .auswahlblatt .auswahltitel {
          flex: 1 1 100%;
        }
        .auswahlblatt select {
          flex: 1 1 100%;
          min-height: 48px;
          font: inherit;
          font-size: 1.1rem;
        }
        .auswahlblatt .auswahlknoepfe {
          display: flex;
          flex: 1 1 100%;
          gap: 10px;
          margin: 0;
        }
        .auswahlblatt .auswahlknoepfe button {
          flex: 1 1 0;
          min-height: 48px;
          font-size: 1rem;
        }
        .auswahlblatt .auswahlhinweis {
          flex: 1 1 100%;
          margin: 0;
          font-weight: 700;
        }
      }
      .tabellenfuss {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: baseline;
        margin: 6px 0 0;
        font-size: 0.92em;
        color: var(--text-leise);
      }
      .untertabellen {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        margin-top: 1rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--rahmen);
      }
      .untertabellen h3 {
        font-size: 0.9rem;
        margin: 0 0 0.3rem;
      }
      .untertabellen ul {
        margin: 0;
        padding-left: 1.2rem;
        font-size: 0.85rem;
      }
      .untertabellen li.entfernt {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .untertabellen li.beendet {
        opacity: 0.7;
      }
      /* Die Symbolknoepfe der Untertabellen: so klein wie ein Zeichen, aber
         mit Rahmen, damit man sieht, dass sie sich druecken lassen. */
      .untertabellen .symbolknopf {
        margin-left: 0.4rem;
        padding: 0 0.35rem;
        min-width: 1.5rem;
        font-size: 0.85rem;
        line-height: 1.3;
      }
      .untertabellen li.entfernt .symbolknopf {
        text-decoration: none;
      }

      /* ---- Die Nebenblaetter (M5) -------------------------------------- */

      /* Aufgeschlagen, gelesen, wieder zugeklappt — nicht das, was waehrend
         eines Einsatzes offen bleibt. Deshalb eine Reiterleiste und keine
         weiteren Abschnitte unter dem Lagebild. */
      .blaetter {
        margin-top: 1rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--rahmen);
      }
      /* Die Reiter sind flach: Ein Reiter ist ein Weg und kein Knopf, und
         der gewaehlte traegt seine Marke unten statt einer Fuellung. */
      .reiterleiste {
        display: flex;
        gap: 0;
        border-bottom: var(--rahmenbreite) solid var(--rahmen);
      }
      .reiterleiste button {
        border: 0;
        background: transparent;
        color: var(--text-leise);
        padding: 0 13px;
        border-bottom: 2px solid transparent;
      }
      .reiterleiste button[aria-selected="true"] {
        font-weight: 700;
        color: var(--text);
        border-bottom: 2px solid var(--kartenkante-farbe);
      }
      .kosten h3 {
        font-size: 0.9rem;
        margin: 0.8rem 0 0.3rem;
      }
      .kosten table {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .kosten .kostentabelle {
        width: 100%;
      }
      .kosten th,
      .kosten td {
        border: 1px solid var(--rahmen);
        padding: 0.15rem 0.4rem;
        text-align: left;
        font-weight: 400;
      }
      .kosten thead th {
        font-weight: 700;
      }
      /* Zahlen rechtsbuendig und mit Tabellenziffern: Betraege untereinander
         sind nur dann vergleichbar, wenn die Stellen uebereinanderstehen. */
      .kosten td.zahl {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .kosten tr.summenzeile th,
      .kosten tr.summenzeile td {
        font-weight: 700;
      }
      .kosten .parameter input {
        width: 8rem;
        text-align: right;
      }

      /* ---- Das Blatt „Versorgung" (S4.1, KONZEPT-S4.md §5) ------------- */

      /* Wie die Lage keine Karte, sondern die Fläche, auf der Band,
         Werkzeugzeile und Karten liegen. Alle Farben kommen aus den Marken. */
      main > section.versorgung,
      main > section.funkplan {
        background: transparent;
        border: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .versorgung h2,
      .funkplan h2 {
        margin: 0;
      }
      .kpiband {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        margin: 0;
        background: var(--karte);
        border: var(--rahmenbreite) solid var(--rahmen);
      }
      .kpiband .kpi {
        display: flex;
        flex-direction: column-reverse;
        padding: 10px 14px;
        border-left: var(--rahmenbreite) solid var(--rahmen-weich);
      }
      .kpiband .kpi:first-child {
        border-left: 0;
      }
      .kpiband dd {
        margin: 0;
        font: 700 26px/1.1 var(--ui);
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .kpiband dt {
        margin-top: 4px;
        font: 600 0.78em/1.2 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-leise);
      }
      /* „ohne Unterkunft" ist die Arbeit, die ansteht: Bernstein. */
      .kpiband .kpi.warn {
        background: var(--warn-bg);
      }
      .kpiband .kpi.warn dd,
      .kpiband .kpi.warn dt {
        color: var(--warn-text);
      }
      .kpiband .kpi.leise {
        background: var(--zeile-alt);
      }
      .werkzeugzeile {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .werkzeughinweis {
        color: var(--text-leise);
        font-size: 0.92em;
      }
      /* Der Umschalter: Knöpfe ohne Zwischenraum, der gewählte gefüllt. */
      .umschalter {
        display: inline-flex;
      }
      .umschalter button + button {
        border-left-width: 0;
      }
      .umschalter button[aria-pressed="true"] {
        background: var(--knopf-fuellung);
        border-color: var(--knopf-fuellung);
        color: var(--knopf-fuellung-text);
        font-weight: 700;
      }
      .versorgungskarte h3 {
        margin: 0 0 8px;
      }
      .versorgung .leise,
      .funkplan .leise {
        color: var(--text-leise);
        font-weight: 400;
      }
      .versorgungstabelle {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95em;
      }
      .versorgungstabelle th,
      .versorgungstabelle td {
        padding: 4px 8px;
        border-bottom: var(--rahmenbreite) solid var(--rahmen-weich);
        text-align: left;
        font-weight: 400;
        white-space: nowrap;
      }
      .versorgungstabelle thead th {
        background: var(--kopf-bg);
        color: var(--text-leise);
        font: 600 0.78em/1.3 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .versorgungstabelle .zahl {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .versorgungstabelle .trenner {
        border-left: var(--rahmenbreite) solid var(--rahmen);
      }
      .versorgungstabelle tr.summenzeile th,
      .versorgungstabelle tr.summenzeile td {
        font-weight: 700;
        background: var(--kopf-bg);
      }
      .versorgungstabelle tr.anmarschzeile th,
      .versorgungstabelle tr.anmarschzeile td {
        color: var(--text-leise);
      }
      .versorgungstabelle tr.anmarschzeile .marke-zustand {
        margin-left: 8px;
      }
      .versorgungstabelle tr.zugangszeile td,
      .vorausschaukarte .zugang {
        color: var(--ok-text);
      }
      .versorgungstabelle tr.abgangszeile td,
      .vorausschaukarte .abgang {
        color: var(--err-text);
      }
      .vorausschaukarten {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .vorausschaukarte {
        padding: 9px 12px;
        border: var(--rahmenbreite) solid var(--rahmen);
        background: var(--karte);
      }
      /* Die nächste Mahlzeit trägt den 2-px-Rahmen. */
      .vorausschaukarte.naechste {
        border: 2px solid var(--kartenkante-farbe);
      }
      .vorausschaukarte header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
      }
      .vorausschaukarte header .marke-zustand {
        margin-left: auto;
      }
      .vorausschaukarte .grosszahl {
        margin: 6px 0 2px;
        font: 700 26px/1.1 var(--ui);
        font-variant-numeric: tabular-nums;
      }
      .vorausschaukarte .grosszahl .leise {
        font-size: 13px;
      }
      .vorausschaukarte .rechnung {
        margin: 0;
        color: var(--text-leise);
        font-variant-numeric: tabular-nums;
      }
      .vorausschauflaeche {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 12px;
        align-items: start;
      }
      .vorausschauflaeche .tabellenrahmen {
        overflow-x: auto;
      }
      .bewegungsliste h4 {
        margin: 0 0 6px;
        font: 600 0.78em/1.3 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-leise);
      }
      .bewegungsliste ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .bewegungsliste li {
        display: grid;
        grid-template-columns: 5.5em 3.5em 1fr;
        gap: 2px 8px;
        padding: 5px 0;
        border-bottom: var(--rahmenbreite) solid var(--rahmen-weich);
        font-variant-numeric: tabular-nums;
      }
      .bewegungsliste li .marke-zustand {
        grid-column: 3;
        justify-self: start;
      }
      .bewegungsliste .wann {
        font-family: var(--mono);
      }
      .bewegungsliste .bewegung-zugang .zahl {
        color: var(--ok-text);
      }
      .bewegungsliste .bewegung-abgang .zahl {
        color: var(--err-text);
      }
      .bewegungsliste .bewegung-ohne_zeit .zahl {
        color: var(--text-leise);
      }
      /* Verpflegung (4d): Plan links, Bestellkarte rechts. */
      .verpflegungsflaeche {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 12px;
        align-items: start;
      }
      .werkzeugrechts {
        margin-left: auto;
      }
      .bestellkarte .bedarfzeile {
        margin: 0 0 8px;
      }
      .bestellkarte .grosszahl {
        font: 700 24px/1.1 var(--ui);
        font-variant-numeric: tabular-nums;
      }
      .bestelldaten {
        display: grid;
        grid-template-columns: 6em 1fr;
        gap: 3px 8px;
        margin: 0 0 6px;
        font-variant-numeric: tabular-nums;
      }
      .bestelldaten dt {
        color: var(--text-leise);
      }
      .bestelldaten dd {
        margin: 0;
      }
      .bestellverlauf {
        margin: 10px 0 0;
        padding: 8px 0 0;
        list-style: none;
        border-top: var(--rahmenbreite) solid var(--rahmen-weich);
        font-variant-numeric: tabular-nums;
      }
      .bestellverlauf li {
        padding: 2px 0;
      }
      .bestellverlauf .wann {
        font-family: var(--mono);
      }
      .bestellverlauf li.blass,
      .versorgungstabelle tr.blass th,
      .versorgungstabelle tr.blass td {
        opacity: 0.5;
      }
      .versorgungstabelle tr.gewaehlt th,
      .versorgungstabelle tr.gewaehlt td {
        background: var(--zeile-gewaehlt);
      }
      .versorgungstabelle input[type="checkbox"] {
        display: inline;
        width: auto;
        margin: 0;
      }
      .versorgungstabelle tr.offenzeile th,
      .versorgungstabelle tr.offenzeile td {
        color: var(--warn-text);
        background: var(--warn-bg);
      }
      .erledigtspalte .erledigt {
        color: var(--ok-text);
      }
      .erledigtspalte .offen {
        color: var(--text-leise);
      }
      .versorgungskarte .werkzeugzeile select {
        display: inline;
        width: auto;
        margin: 0 0 0 4px;
      }
      .regeltabelle input:not([type="checkbox"]) {
        width: 5em;
        margin: 0;
      }
      /* Unterbringung (4e): Karten links, Bedarfstabelle rechts. */
      .unterbringungsflaeche {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      .unterkunftskarten {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .unterkunftskarte {
        padding: 9px 12px;
        border: var(--rahmenbreite) solid var(--rahmen);
        background: var(--karte);
      }
      .unterkunftskarte.aufgeloest {
        opacity: 0.6;
      }
      .unterkunftskarte header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
      }
      .unterkunftskarte header .marke-zustand {
        margin-left: auto;
      }
      .belegungsbalken {
        display: flex;
        height: 10px;
        margin: 8px 0 4px;
        background: var(--zeile-alt);
        border: var(--rahmenbreite) solid var(--rahmen-weich);
        overflow: hidden;
      }
      .belegungsbalken .m,
      .legende .m {
        background: var(--navy-900);
      }
      .belegungsbalken .w,
      .legende .w {
        background: var(--navy-600);
      }
      .belegungsbalken .d,
      .legende .d {
        background: var(--navy-300);
      }
      .belegungszahlen {
        margin: 0;
        font-variant-numeric: tabular-nums;
        color: var(--text-leise);
      }
      .belegungszahlen strong {
        color: var(--text);
      }
      .kartenknoepfe {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0 0;
      }
      .legende {
        margin: 0;
        color: var(--text-leise);
        font: 0.78em var(--mono);
      }
      .legende span {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin: 0 3px 0 8px;
      }
      .versorgungstabelle td.bearbeitbar {
        cursor: text;
      }
      .versorgungstabelle td.bearbeitbar:focus-visible {
        outline: 2px solid var(--knopf-rahmen);
        outline-offset: -2px;
      }
      .versorgungstabelle td.offen select {
        width: 100%;
        margin: 0;
      }
      .versorgungsausgabe {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .versorgungsfuss {
        margin: 0;
        color: var(--text-leise);
        font-size: 0.92em;
      }
      /* Funkplan (Option 5b): Rufgruppen links, Zuordnung rechts. Alle Farben
         aus den Marken, damit Dunkel, Feld und Nacht mitgehen. */
      /* Sechs Kacheln wie die Grundform des Bandes; bei schmalem Fenster drei je Zeile. */
      @media (max-width: 900px) {
        .kpiband.funkband {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .funkflaeche {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      .funkkarte h3 {
        margin: 0 0 8px;
      }
      .funksuche {
        display: inline-block;
        width: 220px;
        margin: 0;
      }
      .funktabelle {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95em;
      }
      .funktabelle th,
      .funktabelle td {
        padding: 4px 8px;
        border-bottom: var(--rahmenbreite) solid var(--rahmen-weich);
        text-align: left;
        font-weight: 400;
        vertical-align: top;
      }
      .funktabelle thead th {
        background: var(--kopf-bg);
        color: var(--text-leise);
        font: 600 0.78em/1.3 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .funktabelle .zahl {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .funktabelle .mono,
      .funkkastentitel {
        font-family: var(--mono);
      }
      .rufgruppenkarte .funktabelle tbody tr {
        cursor: pointer;
      }
      .funktabelle tr.gewaehlt th,
      .funktabelle tr.gewaehlt td {
        background: var(--zeile-gewaehlt);
      }
      .funktabelle tr.blass th,
      .funktabelle tr.blass td {
        opacity: 0.5;
      }
      .funktabelle tr.gruppenkopf th {
        background: var(--zeile-alt);
        border-top: var(--rahmenbreite) solid var(--rahmen);
        font-weight: 700;
      }
      .funktabelle tr.gruppenkopf small {
        margin-left: 8px;
        font-weight: 400;
        color: var(--text-leise);
      }
      .funktabelle tr.erwartet th,
      .funktabelle tr.erwartet td {
        color: var(--text-leise);
      }
      .funktabelle td.bearbeitbar {
        cursor: text;
        white-space: nowrap;
      }
      .funktabelle td.bearbeitbar:focus-visible {
        outline: 2px solid var(--knopf-rahmen);
        outline-offset: -2px;
      }
      .funktabelle td.offen select {
        width: 100%;
        margin: 0;
      }
      .funktabelle .marke-zustand {
        white-space: nowrap;
      }
      .marke-zustand.betriebsart {
        font-family: var(--mono);
      }
      /* Analog: gestrichelt — weder Netz noch Direktbetrieb, sondern Kanal. */
      .marke-zustand.analog {
        border-style: dashed;
        border-color: var(--text-leise);
        background: transparent;
      }
      .durchgestrichen {
        text-decoration: line-through;
        color: var(--text-leise);
      }
      .funkkasten {
        margin-top: 10px;
        padding: 9px 12px;
        border: var(--rahmenbreite) solid var(--rahmen-weich);
        background: var(--zeile-alt);
      }
      .funkkastentitel {
        margin: 0 0 8px;
        color: var(--text-leise);
        font-size: 0.82em;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .funkkasten dl {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 3px 12px;
        margin: 0;
      }
      .funkkasten dl > div {
        display: contents;
      }
      .funkkasten dt {
        color: var(--text-leise);
      }
      .funkkasten dd {
        margin: 0;
      }
      /* Funkplan F2: der Name der Einheit öffnet ihre Maske; das Symbol ist
         klein wie ein Zeichen und zeigt erst beim Zeigen auf die Zeile. */
      .funktabelle th[scope="row"] {
        cursor: pointer;
      }
      .funktabelle .symbolknopf {
        margin-left: 4px;
        padding: 0 0.3rem;
        font-size: 0.85em;
        line-height: 1.3;
        opacity: 0.35;
      }
      .funktabelle tr:hover .symbolknopf,
      .funktabelle .symbolknopf:focus-visible {
        opacity: 1;
      }
      .funktabelle tr.mithoerer th,
      .funktabelle tr.mithoerer td {
        color: var(--text-leise);
        font-style: italic;
      }
      /* Funkplan F3: die Zuordnung markiert eine Einheit für „Funkprobe
         eintragen"; die Schwelle steht in der Werkzeugzeile, der letzte
         Kontakt als Zeile in der Maske. */
      .zuordnungskarte .funktabelle tbody tr:not(.gruppenkopf) {
        cursor: pointer;
      }
      .funktabelle td.kontaktzelle {
        white-space: nowrap;
      }
      .funkschwelle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-leise);
      }
      .funkschwelle select {
        margin: 0;
        width: auto;
      }
      .kontaktzeile {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .kontaktzeile .feldtitel {
        flex-basis: 100%;
      }
      .kontaktzeile .feldtitel small {
        margin-left: 6px;
        color: var(--text-leise);
      }
      .funktabelle td.funkhinweis {
        white-space: normal;
        min-width: 10rem;
      }
      .funktabelle td.offen input {
        width: 100%;
        margin: 0;
      }
      /* Die Maske „Funk und Erreichbarkeit" (Option 5d). */
      fieldset.funkmaske {
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      .funkmaske .feldtitel,
      .funkauszug .feldtitel {
        display: block;
        color: var(--text-leise);
        font-size: 0.92em;
        margin-bottom: 3px;
      }
      .funkmaske small {
        color: var(--text-leise);
        font-weight: 400;
      }
      .rufgruppenchips,
      .ableitungsfeld {
        margin-bottom: 9px;
      }
      .rufgruppenchips ul.chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
        margin: 0 0 4px;
        padding: 0;
        list-style: none;
      }
      .rufgruppenchips li.chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 2px 1px 8px;
        border: var(--rahmenbreite) solid var(--rahmen);
        border-radius: 999px;
        background: var(--zeile-alt);
      }
      .rufgruppenchips .chipweg {
        border: 0;
        background: transparent;
        padding: 0 5px;
        line-height: 1.2;
      }
      .rufgruppenchips select.chipwahl {
        width: auto;
        margin: 0;
      }
      .ableitungszeile {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .ableitungszeile input {
        flex: 1 1 12rem;
        margin: 0;
      }
      .ableitungszeile.lesen output {
        font-family: var(--mono);
      }
      .funkauszug {
        margin-top: 10px;
        padding: 6px 10px;
        border-left: 3px solid var(--rahmen);
        background: var(--zeile-alt);
        font-size: 0.88em;
      }
      .funkauszug ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .funkauszug b {
        font-family: var(--mono);
        margin-right: 4px;
      }
      @media (max-width: 900px) {
        .kpiband {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .kpiband.funkband {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .vorausschauflaeche,
        .unterbringungsflaeche,
        .verpflegungsflaeche,
        .funkflaeche {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .anforderungen h2,
      .kosten h2 {
        font-size: 1rem;
        margin: 0.6rem 0 0.3rem;
      }
      .anforderungsfilter,
      .anforderungneu {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 0.5rem;
        font-size: 0.85rem;
      }
      .anforderungneu label {
        display: flex;
        gap: 0.3rem;
        align-items: center;
      }
      .anforderungstabelle {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      .anforderungstabelle th,
      .anforderungstabelle td {
        border: 1px solid var(--rahmen);
        padding: 0.15rem 0.4rem;
        text-align: left;
        font-weight: 400;
      }
      .anforderungstabelle thead th {
        font-weight: 700;
      }
      /* Der abgeleitete Zustand ist die wichtigste Spalte der Liste (§5.6.2);
         er traegt deshalb Farbe, und zwar dieselbe Ampel wie der Einheiten-
         status: offen mahnt, eingetroffen ist erledigt. */
      .zustand {
        padding: 0 0.3rem;
        border-radius: 0.2rem;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .zustand-offen {
        background: var(--err-bg);
      }
      .zustand-zugesagt {
        background: var(--warn-bg);
      }
      .zustand-eingetroffen {
        background: var(--ok-bg);
      }
      .zustand-storniert {
        background: var(--kopf-bg);
      }
      /* §5.4.5 sinngemaess: Ein Storno loescht nicht, es streicht durch. */
      .anforderungstabelle tr.storniert th,
      .anforderungstabelle tr.storniert td {
        opacity: 0.6;
      }
      .handlungen {
        display: flex;
        gap: 0.3rem;
        flex-wrap: wrap;
      }
      /* Handy: Jede Anforderung ist eine Karte. Die Handlungen stehen als
         sichtbare Leiste unter den Angaben, volle Breite, Knoepfe >= 44 px
         mit Abstand; nichts liegt hinter einem Wisch. */
      @media (max-width: 700px) {
        .anforderungstabelle,
        .anforderungstabelle tbody,
        .anforderungstabelle tr {
          display: block;
          width: 100%;
        }
        .anforderungstabelle thead {
          display: none;
        }
        .anforderungstabelle tr {
          box-sizing: border-box;
          margin: 0 0 12px;
          border: 1px solid var(--rahmen);
          border-radius: 4px;
          background: var(--karte);
        }
        .anforderungstabelle th,
        .anforderungstabelle td {
          display: flex;
          gap: 8px;
          justify-content: space-between;
          border: 0;
          border-bottom: 1px solid var(--rahmen);
          padding: 6px 10px;
          overflow-wrap: anywhere;
        }
