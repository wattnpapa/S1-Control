<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'"
    />
    <title>S1-Control</title>
    <style>
      /* Die Schrift der taktischen Zeichen. Sie liegt im Paket
         (`apps/desktop/assets/tz/schrift/`, Apache-2.0) und nicht bei Google
         Fonts: Die Anwendung laeuft offline (02-ZIELBILD.md), und ein Zeichen
         mit fremder Schrift ist im Ausdruck ein anderes Zeichen. */
      @font-face {
        font-family: "Roboto Slab";
        font-weight: bold;
        font-style: normal;
        src: url("../../assets/tz/schrift/RobotoSlab-Bold.woff") format("woff");
      }

      /* Ein taktisches Zeichen steht inline im Dokument (siehe zeichen.tsx);
         die Groesse gibt der Aufrufer, das SVG traegt seine viewBox. */
      .tz {
        display: inline-block;
        line-height: 0;
      }
      .tz svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .tz-fehlt {
        line-height: 1.2;
        padding: 4px 6px;
        border: var(--rahmenbreite) dashed var(--rahmen);
        color: var(--text-leise);
        text-align: center;
        font-size: 0.92em;
      }

      /* Die Gestaltungsebene aus dem Entwurf
         (docs/v2/entwurf/oberflaeche/HANDOFF-OBERFLAECHE.md, Option 2a).
         Alles haengt an den Marken unter :root, damit ein Themewechsel an
         **einer** Stelle umschaltet: Eine Regel, die ihre Farbe selbst setzt,
         faellt im Nacht- oder Feldbild aus dem Bild. */
      :root {
        --navy-900: #1c2251;
        --navy-800: #14183a;
        --navy-600: #1a3fb0;
        --navy-300: #a9b0d4;
        --grund: #eef0f6;
        --karte: #ffffff;
        --rahmen: #c9cfe0;
        --rahmen-weich: #dde1ec;
        --zeile-alt: #f6f7fb;
        --kopf-bg: #e7eaf3;
        --zeile-gewaehlt: #eaedf7;
        --text: #14183a;
        --text-leise: #5c6484;
        --text-leiser: #8b93ad;
        --ok-bg: #e0f0e6;
        --ok-linie: #a8d3b8;
        --ok-text: #14652f;
        --warn-bg: #fbeccd;
        --warn-linie: #e3c987;
        --warn-text: #7a5c12;
        --err-bg: #f7dede;
        --err-linie: #dda9a9;
        --err-text: #8f1717;
        --neutral-bg: #eceef4;
        --kopfband-bg: var(--navy-900);
        --kopfband-text: #ffffff;
        --kopfband-leise: var(--navy-300);
        --kopfband-gut: #8fe3a8;
        --kartenkante-farbe: var(--navy-800);
        --knopf-rahmen: var(--navy-900);
        --knopf-fuellung: var(--navy-900);
        --knopf-fuellung-text: #ffffff;
        --harke-linie: #000000;
        --gesperrt-bg: #e3e6ef;
        --gesperrt-text: #8b93ad;
        --rahmenbreite: 1px;
        --schrift: 12px;
        --knopfhoehe: 31px;
        --ui: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, Menlo, monospace;
        color-scheme: light;
        font-family: var(--ui);
      }

      /* „Dunkel" ist das Indigo-Bild aus erfassungsbogen.app: derselbe
         Aufbau, nur die Flaechen kehren sich um. */
      :root[data-theme="dunkel"] {
        --grund: #171a2e;
        --karte: #1e2240;
        --rahmen: #343a63;
        --rahmen-weich: #2a2f52;
        --zeile-alt: #232746;
        --kopf-bg: #262b4d;
        --zeile-gewaehlt: #2c3260;
        --text: #e6e8f6;
        --text-leise: #a9b0d4;
        --text-leiser: #7d85ad;
        --ok-bg: #1c3a28;
        --ok-linie: #2f6a45;
        --ok-text: #9ed17e;
        --warn-bg: #3a3016;
        --warn-linie: #6d5a24;
        --warn-text: #e3c987;
        --err-bg: #3d1f1f;
        --err-linie: #6d3434;
        --err-text: #ffa8a8;
        --neutral-bg: #232746;
        --kartenkante-farbe: #6b74a8;
        --knopf-rahmen: #6b74a8;
        --knopf-fuellung: #3b4383;
        --harke-linie: #c3c8e4;
        --gesperrt-bg: #262b4d;
        --gesperrt-text: #7d85ad;
        color-scheme: dark;
      }

      /* „Feld": 2-px-Raender, groessere Schrift, hohe Knoepfe — fuer
         Handschuhe und fuer Sonne auf dem Bildschirm. */
      :root[data-theme="feld"] {
        --grund: #e9ebf0;
        --rahmen: #000000;
        --rahmen-weich: #000000;
        --text: #000000;
        --text-leise: #000000;
        --text-leiser: #333333;
        --kartenkante-farbe: #000000;
        --knopf-rahmen: #000000;
        /* Ein gesperrter Knopf darf im Feldbild nicht schwarz auf schwarz
           stehen: Der Rahmen ist hier ueberall schwarz, die Fuellung nicht. */
        --gesperrt-bg: #d5d8e0;
        --gesperrt-text: #4a4a4a;
        --rahmenbreite: 2px;
        --schrift: 14px;
        --knopfhoehe: 38px;
      }

      /* „Nacht": Bernstein auf Schwarz, kein weisser Grund. */
      :root[data-theme="nacht"] {
        --navy-900: #14120a;
        --navy-300: #c8a232;
        --grund: #0c0b06;
        --karte: #14120a;
        --rahmen: #3a3418;
        --rahmen-weich: #2a2410;
        --zeile-alt: #191509;
        --kopf-bg: #1c1809;
        --zeile-gewaehlt: #241f0c;
        --text: #e8dfae;
        --text-leise: #c8a232;
        --text-leiser: #8d7a34;
        --ok-bg: #1b2a14;
        --ok-linie: #3d5a2c;
        --ok-text: #9ed17e;
        --warn-bg: #2a2410;
        --warn-linie: #5a4c1e;
        --warn-text: #e0b84a;
        --err-bg: rgba(239, 68, 68, 0.26);
        --err-linie: #7a3535;
        --err-text: #ffa8a8;
        --neutral-bg: #191509;
        --kopfband-bg: #14120a;
        --kopfband-text: #f0e5b0;
        --kopfband-leise: #c8a232;
        --kopfband-gut: #9ed17e;
        --kartenkante-farbe: #c8a232;
        --knopf-rahmen: #5a4c1e;
        --knopf-fuellung: #c8a232;
        --knopf-fuellung-text: #14120a;
        --harke-linie: #c8a232;
        --gesperrt-bg: #241f0c;
        --gesperrt-text: #8d7a34;
        color-scheme: dark;
      }

      /* `hidden` muss staerker sein als jede Anzeigeregel darunter: Ein
         ausgeblendetes Blatt bleibt sonst sichtbar, weil `.lagespalten`
         ein `display: flex` traegt. */
      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--grund);
        color: var(--text);
        font-size: var(--schrift);
      }
      .arbeitsplatz {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ---- Führungsharke (Entwurf, Option 3a) ---------------------------- */

      .fueorgkopf {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .fueorgkopf h2 {
        margin: 0;
      }
      .fueorgkopf .spaltengruppen {
        margin: 0 0 0 auto;
      }
      .fueorgflaeche {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .harke {
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        padding: 8px 0 16px;
      }
      /* Der Stamm ist die senkrechte Linie, der Querbalken die waagerechte.
         Beide 3 px schwarz — im Nachtbild bernstein, damit sie auf dem
         schwarzen Grund überhaupt stehen. */
      .harke .stamm {
        width: 3px;
        margin: 0 auto;
        background: var(--harke-linie);
      }
      /* Der Balken spannt ueber die ganze Reihe darunter — ohne `stretch`
         schrumpfte er in der zentrierten Spalte auf null Breite. */
      .harke .quer {
        height: 3px;
        align-self: stretch;
        background: var(--harke-linie);
      }
      .harke .reihe {
        display: grid;
        justify-items: center;
      }
      .harke .zelle {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 0;
        padding: 0 8px;
      }
      .harke .knoten {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .harke .knoten.aufgeloest {
        opacity: 0.55;
      }
      .harke .knoten.aufgeloest .name {
        text-decoration: line-through;
      }
      .harke .unterschrift,
      .einrichtungen .unterschrift {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 4px 0 2px;
        font-size: 10.5px;
        line-height: 1.35;
        color: var(--text-muted-2, var(--text-leise));
        text-align: center;
      }
      .harke .unterschrift .name {
        font-weight: 700;
        color: var(--text);
      }
      .harke .unterschrift .typ {
        color: var(--text-leiser);
      }
      .harke .unterschrift .zahlen,
      .einrichtungen .unterschrift {
        font-variant-numeric: tabular-nums;
      }
      /* Die Zeichen tragen ihre eigene Farbe (gelb mit schwarzem Rand) und
         folgen keinem Theme: Ein taktisches Zeichen ist genormt, und ein
         graues Zeichen wäre ein anderes. Im Nachtbild bekommt es einen
         schmalen Grund, damit der schwarze Rand nicht im Grund verschwindet. */
      :root[data-theme="nacht"] .tz,
      :root[data-theme="dunkel"] .tz {
        background: #d8d3c0;
        padding: 2px;
      }
      .einrichtungen {
        flex: 0 0 300px;
        border-left: var(--rahmenbreite) solid var(--rahmen);
        padding-left: 14px;
      }
      .einrichtungen h3 {
        margin: 0 0 9px;
        font: 400 0.84em/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-leise);
      }
      .einrichtungen ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .einrichtungen li {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .einrichtungen li .name {
        font-weight: 700;
        padding-top: 4px;
      }

      /* ---- Kopfband (Entwurf, Option 2a) -------------------------------- */

      .kopfband {
        background: var(--kopfband-bg);
        color: var(--kopfband-text);
        padding: 11px 20px 0;
      }
      .kopfband .weg button.alsLink {
        height: auto;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--kopfband-leise);
        font: 400 12px/1.4 var(--ui);
        cursor: pointer;
      }
      .kopfband .weg button.alsLink:hover {
        color: var(--kopfband-text);
      }
      .kopfband .zeile {
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 6px 0 9px;
      }
      .kopfband .marke {
        width: 44px;
        height: 30px;
        display: grid;
        place-items: center;
        background: var(--navy-600);
        border: 1px solid #6b74a8;
        color: #ffffff;
        font: 700 9px/1 var(--ui);
        letter-spacing: 0.08em;
      }
      .kopfband h1 {
        font-size: 21px;
        font-weight: 700;
        margin: 0;
      }
      .kopfband .kennzahl {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .kopfband .kennzahl .label {
        font: 400 9.5px/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--kopfband-leise);
      }
      .kopfband .kennzahl .wert {
        font-size: 30px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .kopfband .hilfeknopf {
        margin-left: auto;
        height: auto;
        padding: 6px 12px;
        background: transparent;
        border: 1px solid var(--kopfband-leise);
        color: var(--kopfband-text);
      }
      .kopfband .themenschalter {
        display: flex;
        border: 1px solid var(--kopfband-text);
      }
      .kopfband .themenschalter button {
        border: 0;
        height: auto;
        padding: 7px 12px;
        background: transparent;
        color: var(--kopfband-leise);
        font: 400 12px/1 var(--ui);
      }
      .kopfband .themenschalter button[aria-pressed="true"] {
        background: var(--kopfband-text);
        color: var(--kopfband-bg);
        font-weight: 700;
      }
      .kopfband .zustandszeile {
        font-size: 12px;
        padding-bottom: 9px;
        color: var(--kopfband-gut);
      }
      .kopfband .zustandszeile.gestoert {
        color: var(--warn-linie);
      }
      /* Die Reiterzeile schliesst das Kopfband nach unten ab: Der gewaehlte
         Reiter traegt seine Marke dort, wo die Arbeitsflaeche beginnt. */
      .kopfband .reiter {
        display: flex;
        gap: 2px;
      }
      .kopfband .reiter button {
        height: auto;
        padding: 7px 13px 6px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--kopfband-leise);
        font: 400 13px/1.2 var(--ui);
      }
      .kopfband .reiter button[aria-selected="true"] {
        color: var(--kopfband-text);
        font-weight: 700;
        border-bottom-color: var(--kopfband-text);
      }
      .kopfband .reiter button.rechts {
        margin-left: auto;
      }
      .kopfband .reiter .zaehler {
        margin-left: 6px;
        color: #f0c368;
        font-variant-numeric: tabular-nums;
      }

      /* ---- Stärkeband ---------------------------------------------------- */

      .staerkeband {
        display: flex;
        background: var(--karte);
        border-bottom: 1px solid var(--rahmen);
      }
      .staerkeband .kachel {
        flex: 1;
        padding: 11px 13px;
        border-left: 1px solid var(--rahmen-weich);
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .staerkeband .kachel:first-child {
        border-left: 0;
      }
      .staerkeband .kachel.summe {
        background: var(--zeile-alt);
      }
      .staerkeband .zahl {
        font-size: 27px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .staerkeband .label {
        font: 400 0.84em/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-leise);
      }

      /* ---- Arbeitsfläche ------------------------------------------------- */

      main {
        flex: 1;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      /* Jede Ansicht der Arbeitsfläche ist eine Karte: eckig, 1-px-Rahmen und
         eine 3-px-Oberkante, an der das Auge die Blöcke trennt. */
      /* Die Lage ist keine Karte, sondern die Flaeche, auf der die Karten
         liegen: Baum, Einheiten, Ausgaben, Nebenblaetter, Tagebuch. */
      main > section.lage {
        background: transparent;
        border: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      main > section,
      .lagespalten > .baum,
      .lagespalten > .einheiten,
      .lage > .ausgaben,
      .lage > .blaetter,
      .lage > .tagebuch,
      .karte {
        background: var(--karte);
        border: var(--rahmenbreite) solid var(--rahmen);
        border-top: 3px solid var(--kartenkante-farbe);
        padding: 13px;
      }
      h2 {
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 9px;
      }
      h3 {
        font-size: 12.5px;
        font-weight: 700;
      }
      label {
        display: block;
        margin-bottom: 9px;
        color: var(--text-leise);
        font-size: 0.92em;
      }
      input,
      select {
        display: block;
        width: min(30rem, 100%);
        margin-top: 4px;
        padding: 6px 8px;
        background: var(--karte);
        color: var(--text);
        border: var(--rahmenbreite) solid var(--rahmen);
        border-radius: 0;
        font: 400 var(--schrift) / 1.35 var(--ui);
      }
      input:focus-visible,
      select:focus-visible {
        outline: 0;
        border: 2px solid var(--knopf-rahmen);
      }
      /* Knöpfe: gefüllt ist der Hauptweg, umrandet der Nebenweg. */
      button {
        height: var(--knopfhoehe);
        padding: 0 13px;
        border: var(--rahmenbreite) solid var(--knopf-rahmen);
        border-radius: 0;
        background: var(--karte);
        color: var(--text);
        font: 400 var(--schrift) / 1 var(--ui);
        cursor: pointer;
      }
      button.haupt {
        background: var(--knopf-fuellung);
        border-color: var(--knopf-fuellung);
        color: var(--knopf-fuellung-text);
        font-weight: 700;
      }
      button:disabled {
        background: var(--gesperrt-bg);
        border-color: var(--knopf-rahmen);
        color: var(--gesperrt-text);
        cursor: default;
      }

      /* Die Statuszeile steht unten und bleibt dort: Sie ist die einzige
         Auskunft ueber Stand und Erreichbarkeit und darf nicht wegscrollen. */
      .statuszeile {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        min-height: 30px;
        padding: 0 14px;
        background: var(--karte);
        border-top: 1px solid var(--rahmen);
        font-size: 0.96em;
      }
      .statuszeile .staerke {
        margin-left: auto;
        font-family: var(--mono);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      /* Zustandsmarken: Status in der Tabelle, Ampeln im Eingangskorb. Farbe
         **und** Wort — eine Auskunft, die nur an der Farbe haengt, faellt bei
         Rotschwaeche aus. */
      .marke-zustand {
        display: inline-block;
        padding: 2px 6px;
        border: var(--rahmenbreite) solid var(--neutral-bg);
        background: var(--neutral-bg);
        color: var(--text-leise);
        font: 700 0.82em/1.3 var(--ui);
        letter-spacing: 0.04em;
      }
      .marke-zustand.ok {
        background: var(--ok-bg);
        border-color: var(--ok-linie);
        color: var(--ok-text);
      }
      .marke-zustand.warn {
        background: var(--warn-bg);
        border-color: var(--warn-linie);
        color: var(--warn-text);
      }
      .marke-zustand.fehler {
        background: var(--err-bg);
        border-color: var(--err-linie);
        color: var(--err-text);
      }

      .warnung {
        color: var(--warn-text);
      }
      .fehler {
        color: var(--err-text);
      }
      .fehlerbild {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 14px 14px 0;
        padding: 9px 13px;
        background: var(--err-bg);
        border: var(--rahmenbreite) solid var(--err-linie);
        color: var(--err-text);
      }
      .hinweistext {
        color: var(--text-leise);
        font-size: 0.92em;
        line-height: 1.45;
      }
      .hinweise ul {
        margin: 0;
        padding-left: 1.2rem;
      }

      /* ---- Das Lagebild (M3) ------------------------------------------- */

      .lagekopf {
        gap: 8px;
        margin-bottom: 0;
      }
      .lagekopf,
      .baumkopf {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .lagekopf h2,
      .baumkopf h2 {
        margin: 0 0.5rem 0 0;
      }
      .lagespalten {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: flex-start;
      }
      /* Der Baum steht fest und schmal (Entwurf: 266 px): Er ist die
         Gliederung und nicht der Inhalt; die Breite gehoert der Tabelle. */
      .baum {
        flex: 0 0 300px;
        min-width: 300px;
        overflow: hidden;
      }
      /* Im Feldbild ist die Schrift groesser — der Baum bekommt die Breite,
         die er dafuer braucht, statt jeden zweiten Namen zu kuerzen. */
      :root[data-theme="feld"] .baum {
        flex-basis: 340px;
        min-width: 340px;
      }
      .baumliste {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      /* Name links, Zahlen rechts, und der Name gibt nach: In einer schmalen
         Spalte ist die Stelle, an der gekuerzt werden darf, der Name — die
         Staerke daneben ist der Grund, aus dem die Zeile ueberhaupt gelesen
         wird. */
      .baumzeile {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        background: none;
        border: 1px solid transparent;
        padding: 0.2rem 0.4rem;
        font: inherit;
        cursor: pointer;
      }
      .baumzeile:hover {
        border-color: var(--rahmen);
      }
      /* Die gewaehlte Zeile ist gefuellt und nicht nur umrandet: Sie ist der
         Bezug, auf den sich die ganze rechte Seite beruft. */
      .baumzeile.gewaehlt {
        background: var(--knopf-fuellung);
        border-color: var(--knopf-fuellung);
        color: var(--knopf-fuellung-text);
        font-weight: 700;
      }
      /* Das Zeichen der Zeile: feste Breite, damit die Namen darunter in
         einer Flucht stehen — eine Spalte, die mal 22 und mal 0 px breit ist,
         zerreisst den Baum optisch. */
      .baumzeile .baumzeichen {
        flex: 0 0 26px;
        line-height: 0;
      }
      .baumzeile .name {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Der Typ steht als Kuerzel und in Mono: „EINSATZORT" ausgeschrieben
         nimmt in einer 288-px-Spalte den Platz des Namens weg. */
      .baumzeile .typ {
        flex: 0 3 auto;
        font: 400 0.8em/1 var(--mono);
        color: var(--text-leiser);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 7em;
      }
      .baumzeile.gewaehlt .typ {
        color: inherit;
      }
      /* Die Zahlen stehen rechts und in Tabellenziffern: Wer Staerken
         vergleicht, liest Spalten und keine Woerter. */
      .baumzeile .zahlen {
        margin-left: auto;
        white-space: nowrap;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.85em;
      }
      .schalter {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        margin: 0;
        font-size: 0.85rem;
      }
      .schalter input {
        display: inline;
        width: auto;
      }
      /* Die Maske liegt ueber der Ansicht, damit der Blick nicht springt,
         und sie ist schmal: Ein Formular, das die ganze Breite fuellt,
         zwingt das Auge bei jeder Zeile quer ueber den Bildschirm. */
      .maske {
        position: fixed;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        min-width: 22rem;
        max-width: min(32rem, 90vw);
        padding: 16px;
        border: var(--rahmenbreite) solid var(--rahmen);
        border-top: 3px solid var(--kartenkante-farbe);
        background: var(--karte);
        /* Der einzige Schatten im Programm: Er sagt, dass diese Maske vor der
           Ansicht liegt und den Fokus hat. */
        box-shadow: 0 14px 40px rgba(9, 20, 48, 0.22);
      }
      .maske h3 {
        margin: 0 0 0.8rem;
        font-size: 1rem;
      }
      .maskenknoepfe {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      select {
        display: block;
        width: min(40rem, 100%);
        padding: 0.3rem;
      }

      /* ---- Die Einheitentabelle (M3.2) ---------------------------------- */

      .einheiten {
        flex: 3 1 40rem;
        min-width: 0;
      }
      .einheitenkopf {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .einheitenkopf h2 {
        margin: 0 0.5rem 0 0;
      }
      /* Ein senkrechter Strich statt eines Umbruchs: Er trennt das Anlegen
         von den Schritten, die auf einer Auswahl arbeiten. */
      .einheitenkopf .trenner {
        width: 1px;
        align-self: stretch;
        margin: 0 4px;
        background: var(--rahmen);
      }
      /* Die Suche steht rechts und ist breit genug fuer den Platzhalter:
         Gesucht wird nach Bezeichnung, Organisation, Ort und Kennzeichen. */
      .suchfeld {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 0 auto;
        text-transform: none;
        letter-spacing: 0;
      }
      .suchfeld input {
        display: inline;
        width: 17rem;
        margin-top: 0;
      }
      /* Die Spaltengruppen sind ein Umschalter und keine Liste von
         Kaestchen: Fuenf Haken in Versalien ueber einer Tabelle lesen sich
         wie eine zweite Kopfzeile. */
      .spaltengruppen {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        margin: 9px 0;
        border: var(--rahmenbreite) solid var(--rahmen);
        width: fit-content;
      }
      .spaltengruppen button {
        border: 0;
        border-left: var(--rahmenbreite) solid var(--rahmen);
        background: var(--karte);
        color: var(--text-leise);
        font-size: 0.92em;
      }
      .spaltengruppen button:first-child {
        border-left: 0;
      }
      .spaltengruppen button[aria-pressed="true"] {
        background: var(--kopf-bg);
        color: var(--text);
        font-weight: 700;
      }
      .spaltengruppen button:disabled[aria-pressed="true"] {
        background: var(--kopf-bg);
        color: var(--text-leise);
      }
      /* Die Tabelle darf breiter sein als das Fenster: Die Excel hat 48
         Spalten, und wer die Kostenuebersicht zuschaltet, will scrollen und
         nicht umbrechen. Der Rahmen scrollt, nicht die Seite. */
      .tabellenrahmen {
        overflow-x: auto;
        border: 1px solid var(--rahmen);
      }
      .einheiten table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      /* Die Zeilen bleiben einzeilig: Die Tabelle ist ein Vergleich ueber
         Zeilen hinweg, und umbrechende Zellen verschieben jede Zeile
         gegeneinander. Die Excel hat 48 Spalten; wer Ressourcen, Logistik
         oder Kosten zuschaltet, scrollt waagerecht — der Rahmen scrollt,
         nicht die Seite. */
      .einheiten th,
      .einheiten td {
        border-bottom: 1px solid var(--rahmen-weich);
        padding: 6px 8px;
        text-align: left;
        white-space: nowrap;
      }
      /* Spaltenkoepfe in Mono und Versalien: Sie sind Beschriftung und keine
         Aussage, und sie sollen sich von den Werten darunter unterscheiden. */
      .einheiten thead th {
        position: sticky;
        top: 0;
        background: var(--kopf-bg);
        border-bottom: var(--rahmenbreite) solid var(--rahmen);
        font: 400 0.84em/1.4 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-leise);
      }
      .einheiten tbody tr:hover {
        background: var(--zeile-alt);
      }
      .einheiten tbody tr.markiert {
        background: var(--zeile-gewaehlt);
      }
      .einheiten tbody tr.gewaehlt th[scope="row"] {
        font-weight: 700;
      }
      /* Eine entfernte Einheit bleibt sichtbar (§5.4.5) und ist durchgestrichen:
         Sie zaehlt nicht mehr, ist aber nicht fort. */
      .einheiten tbody tr.entfernt {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .einheiten th.zahl,
      .einheiten td.zahl {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      /* Die Summenzeile traegt den Kopfgrund: Sie gehoert zur Tabelle und
         nicht zu den Zeilen darueber. */
      .einheiten tfoot th,
      .einheiten tfoot td {
        background: var(--kopf-bg);
        font-weight: 700;
        border-top: var(--rahmenbreite) solid var(--rahmen);
      }
      .einheiten td.berechnet {
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }
      /* Eine umstrittene Zelle wird markiert und nicht still ueberschrieben —
         die sichtbare Seite von §3.8. Farbe **und** Zeichen: Eine Auskunft,
         die nur an der Farbe haengt, faellt bei Rotschwaeche aus. */
      .einheiten td.umstritten {
        background: var(--warn-bg);
      }
      /* Die offene Zelle traegt einen 2-px-Fokusrahmen: Wer im Feld tippt,
         muss ohne Suchen sehen, welche Zelle seine Eingabe nimmt. */
      .einheiten td.bearbeitet {
        outline: 2px solid var(--knopf-rahmen);
        outline-offset: -2px;
      }
      .einheiten td.bearbeitet input,
      .einheiten td.bearbeitet select {
        display: block;
        width: 12rem;
        margin: 0;
        padding: 2px 4px;
        font: inherit;
      }
      .tabellenfuss {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: baseline;
        margin: 6px 0 0;
        font-size: 0.92em;
        color: var(--text-leise);
      }
      .untertabellen {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        margin-top: 1rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--rahmen);
      }
      .untertabellen h3 {
        font-size: 0.9rem;
        margin: 0 0 0.3rem;
      }
      .untertabellen ul {
        margin: 0;
        padding-left: 1.2rem;
        font-size: 0.85rem;
      }
      .untertabellen li.entfernt {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .untertabellen li.beendet {
        opacity: 0.7;
      }

      /* ---- Die Nebenblaetter (M5) -------------------------------------- */

      /* Aufgeschlagen, gelesen, wieder zugeklappt — nicht das, was waehrend
         eines Einsatzes offen bleibt. Deshalb eine Reiterleiste und keine
         weiteren Abschnitte unter dem Lagebild. */
      .blaetter {
        margin-top: 1rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--rahmen);
      }
      /* Die Reiter sind flach: Ein Reiter ist ein Weg und kein Knopf, und
         der gewaehlte traegt seine Marke unten statt einer Fuellung. */
      .reiterleiste {
        display: flex;
        gap: 0;
        border-bottom: var(--rahmenbreite) solid var(--rahmen);
      }
      .reiterleiste button {
        border: 0;
        background: transparent;
        color: var(--text-leise);
        padding: 0 13px;
        border-bottom: 2px solid transparent;
      }
      .reiterleiste button[aria-selected="true"] {
        font-weight: 700;
        color: var(--text);
        border-bottom: 2px solid var(--kartenkante-farbe);
      }
      .kosten h3 {
        font-size: 0.9rem;
        margin: 0.8rem 0 0.3rem;
      }
      .kosten table {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .kosten .kostentabelle {
        width: 100%;
      }
      .kosten th,
      .kosten td {
        border: 1px solid var(--rahmen);
        padding: 0.15rem 0.4rem;
        text-align: left;
        font-weight: 400;
      }
      .kosten thead th {
        font-weight: 700;
      }
      /* Zahlen rechtsbuendig und mit Tabellenziffern: Betraege untereinander
         sind nur dann vergleichbar, wenn die Stellen uebereinanderstehen. */
      .kosten td.zahl {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .kosten tr.summenzeile th,
      .kosten tr.summenzeile td {
        font-weight: 700;
      }
      .kosten .parameter input {
        width: 8rem;
        text-align: right;
      }

      .anforderungen h2,
      .kosten h2 {
        font-size: 1rem;
        margin: 0.6rem 0 0.3rem;
      }
      .anforderungsfilter,
      .anforderungneu {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 0.5rem;
        font-size: 0.85rem;
      }
      .anforderungneu label {
        display: flex;
        gap: 0.3rem;
        align-items: center;
      }
      .anforderungstabelle {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      .anforderungstabelle th,
      .anforderungstabelle td {
        border: 1px solid var(--rahmen);
        padding: 0.15rem 0.4rem;
        text-align: left;
        font-weight: 400;
      }
      .anforderungstabelle thead th {
        font-weight: 700;
      }
      /* Der abgeleitete Zustand ist die wichtigste Spalte der Liste (§5.6.2);
         er traegt deshalb Farbe, und zwar dieselbe Ampel wie der Einheiten-
         status: offen mahnt, eingetroffen ist erledigt. */
      .zustand {
        padding: 0 0.3rem;
        border-radius: 0.2rem;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .zustand-offen {
        background: var(--err-bg);
      }
      .zustand-zugesagt {
        background: var(--warn-bg);
      }
      .zustand-eingetroffen {
        background: var(--ok-bg);
      }
      .zustand-storniert {
        background: var(--kopf-bg);
      }
      /* §5.4.5 sinngemaess: Ein Storno loescht nicht, es streicht durch. */
      .anforderungstabelle tr.storniert th,
      .anforderungstabelle tr.storniert td {
        opacity: 0.6;
      }
      .handlungen {
        display: flex;
        gap: 0.3rem;
        flex-wrap: wrap;
      }

      .fuehrungsstelle h2 {
        font-size: 1rem;
        margin: 0.6rem 0 0.3rem;
      }
      .fuehrungsstelle h3 {
        font-size: 0.9rem;
        margin: 0.8rem 0 0.3rem;
      }
      .fuestsumme ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.85rem;
      }
      .dienstpostenneu,
      .planneu {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin: 0.5rem 0;
        font-size: 0.85rem;
      }
      .dienstpostenneu label,
      .planneu label {
        display: flex;
        gap: 0.3rem;
        align-items: center;
      }
      .dienstposten,
      .schichtplan {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .schichtplan {
        width: 100%;
      }
      .dienstposten th,
      .dienstposten td,
      .schichtplan th,
      .schichtplan td {
        border: 1px solid var(--rahmen);
        padding: 0.15rem 0.4rem;
        text-align: left;
        font-weight: 400;
      }
      .dienstposten thead th,
      .schichtplan thead th {
        font-weight: 700;
      }
      .dienstposten tr.summenzeile th,
      .dienstposten tr.summenzeile td {
        font-weight: 700;
      }
      /* §5.4.5 sinngemaess: Ein entfernter Posten bleibt sichtbar — sonst
         liesse er sich nicht wiederherstellen, weil ihn niemand mehr sieht. */
      .dienstposten tr.entfernt th,
      .dienstposten tr.entfernt td {
        opacity: 0.55;
        text-decoration: line-through;
      }
      /* Die Planzellen tragen mehrzeiligen Freitext (ZDM §1.14): Name,
         Herkunft, Erreichbarkeit. Sie duerfen breit sein. */
      .schichtplan input {
        width: 100%;
        min-width: 12rem;
      }

      /* ---- Der Programmstand (M7.2) ------------------------------------ */

      /* Ein Angebot und keine Warnung: Es liegt etwas bereit, jemand kann es
         einspielen, wenn die Lage es zulaesst. Ein abgelehntes Paket ist die
         andere Nachricht — entweder hat jemand vergessen zu signieren, oder
         es hat jemand versucht, der es nicht darf. */
      .programmstand {
        margin: 0.5rem 0;
        padding: 0.4rem 0.6rem;
        border-left: 3px solid var(--ok-linie);
        background: var(--ok-bg);
        font-size: 0.85rem;
      }
      .programmstand.abgelehnt {
        border-left-color: var(--err-linie);
        background: var(--err-bg);
      }

      /* ---- Der Eingangskorb (M6.1) ------------------------------------- */

      /* Die Ampel der Excel: gelb heisst „liegt an", gruen „uebernommen",
         grau „bewusst abgelehnt". Sie ist hier kein Anstrich, sondern der
         abgeleitete uebernahmeZustand (§5.8.1) — sie kann nicht vergessen
         werden, wie es in einer Tabelle geschieht. */
      .eingangskorb h2 {
        font-size: 1rem;
        margin: 0.6rem 0 0.3rem;
      }
      .eingangsfilter {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 0.5rem;
        font-size: 0.85rem;
      }
      .meldungstabelle {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      .meldungstabelle th,
      .meldungstabelle td {
        border: 1px solid var(--rahmen);
        padding: 0.15rem 0.4rem;
        text-align: left;
        font-weight: 400;
      }
      .meldungstabelle thead th {
        font-weight: 700;
      }
      /* Die Ampeln des Eingangskorbs sind dieselben Marken wie der Status in
         der Tabelle — eine Meldung, die „neu" ist, sieht aus wie eine
         Einheit, die im Anmarsch ist. */
      .ampel {
        display: inline-block;
        padding: 2px 6px;
        border: var(--rahmenbreite) solid var(--neutral-bg);
        background: var(--neutral-bg);
        color: var(--text-leise);
        font: 700 0.82em/1.3 var(--ui);
        letter-spacing: 0.04em;
      }
      .ampel-neu,
      .ampel-geaendert {
        background: var(--warn-bg);
        border-color: var(--warn-linie);
        color: var(--warn-text);
      }
      .ampel-uebernommen {
        background: var(--ok-bg);
        border-color: var(--ok-linie);
        color: var(--ok-text);
      }
      .ampel-abgelehnt {
        background: var(--neutral-bg);
        border-color: var(--rahmen);
      }
      /* §5.8.1: Eine abgelehnte Meldung bleibt sichtbar — Loeschen ist
         verboten. Sie wird blass, nicht unsichtbar. */
      .meldungstabelle tr.abgelehnt th,
      .meldungstabelle tr.abgelehnt td {
        opacity: 0.6;
      }
      .buendel {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 0.6rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px dashed var(--rahmen);
        font-size: 0.85rem;
      }
      .buendel label {
        display: flex;
        gap: 0.3rem;
        align-items: center;
      }
      .revisionen {
        margin-top: 0.8rem;
        padding: 0.5rem;
        border: 1px solid var(--rahmen);
        border-radius: 0.3rem;
      }
      .revisionenkopf {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .revisionenkopf h3 {
        font-size: 0.9rem;
        margin: 0;
      }
      .fassungen {
        margin: 0.4rem 0 0;
        padding-left: 1.4rem;
        font-size: 0.85rem;
      }
      .fassungen li.kopf {
        font-weight: 700;
      }
      .fassungen .felder {
        font-weight: 400;
        opacity: 0.75;
        font-size: 0.8rem;
      }

      /* Die Historie zeigt Staende, der Diff zeigt Bewegung — deshalb steht
         er unter den Fassungen und nicht zwischen ihnen (M6.2). */
      .bewegung {
        margin-top: 0.6rem;
        padding-top: 0.4rem;
        border-top: 1px dashed var(--rahmen);
        font-size: 0.85rem;
      }
      .bewegung h4 {
        font-size: 0.85rem;
        margin: 0 0 0.3rem;
      }
      .bewegung ul {
        margin: 0.1rem 0 0.4rem;
        padding-left: 1.2rem;
      }

      /* ---- Der Staerke-Monitor (M3.5) ---------------------------------- */

      /* Dieses Fenster wird nicht bedient, sondern gelesen — von der anderen
         Seite des Raums, im Vorbeigehen, oft schraeg. Daraus folgt alles
         Weitere und nichts davon ist Geschmack:

           * Fester schwarzer Grund mit weisser Schrift statt `color-scheme`.
             Der Monitor haengt an der Wand; welches Farbschema der Rechner
             gerade faehrt, ist fuer die Lesbarkeit aus fuenf Metern
             gleichgueltig — hoher Kontrast ist es nicht. Ein Fenster, das
             ueber Nacht hell wird, blendet den Raum.
           * Zentriert und ohne Zierrat: Es steht genau eine Zahl im Raum.
           * `tabular-nums` wie in der Statuszeile und im Abschnittsbaum: Wer
             Staerken vergleicht, liest Spalten und keine Woerter — und die
             Ziffern springen nicht, wenn die Zahl sich im Sekundentakt
             aendert. Die feste Zeichenbreite ist zugleich die Grundlage der
             dynamischen Schrift (siehe `schriftgroesse` in
             monitorZahlen.ts).

         Die Groesse der grossen Zeile steht bewusst **nicht** hier, sondern
         kommt als `style` aus der Komponente: Sie haengt an der Fenstergroesse
         und damit an einer Zahl, die erst zur Laufzeit feststeht. */
      .monitor {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
        background: #000;
        color: #fff;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .monitor p {
        margin: 0;
        max-width: 100%;
      }
      /* Die grosse Zahl: Ihre Groesse setzt die Komponente, hier stehen nur
         die Eigenschaften, die von ihr unabhaengig sind. `line-height: 1`
         verhindert, dass die Zeile bei grossen Graden mehr Platz beansprucht
         als sie fuellt — die Heuristik rechnet mit der Schrifthoehe. */
      .monitor .monitorstaerke {
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.02em;
        overflow-wrap: anywhere;
      }
      /* Die Beschriftung sagt, welche der drei Zahlen was ist. Sie darf klein
         sein: Wer sie einmal gelesen hat, liest danach nur noch die Zahl. */
      .monitor .monitorbeschriftung {
        font-size: clamp(0.8rem, 2vw, 1.4rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.65;
      }
      /* Die NATO-Zeit ist die zweitwichtigste Angabe des Monitors und deshalb
         deutlich groesser als der Fuss, aber klar unter der Staerke. */
      .monitor .monitorzeit {
        font-size: clamp(1.2rem, 6vw, 4rem);
        letter-spacing: 0.06em;
      }
      .monitor .monitorfuss {
        font-size: clamp(0.8rem, 2.5vw, 1.6rem);
        opacity: 0.75;
      }
      /* Ohne geoeffnete Akte bleibt der Monitor ruhig: gedaempft, ohne die
         grosse Zahl — er behauptet dann nichts ueber eine Staerke. */
      .monitor .monitorhinweis {
        font-size: clamp(1rem, 4vw, 2.4rem);
        opacity: 0.55;
      }
      /* ---- Das Einsatztagebuch (M3.3) ----------------------------------- */

      .tagebuch {
        margin-top: 1.5rem;
      }
      .tagebuchkopf {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-bottom: 0.5rem;
      }
      .tagebuchkopf h2 {
        margin: 0 0.5rem 0 0;
      }
      .tagebuch table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      .tagebuch th,
      .tagebuch td {
        border-bottom: 1px solid var(--rahmen-weich);
        padding: 0.15rem 0.4rem;
        text-align: left;
        vertical-align: top;
      }
      .tagebuch thead th {
        position: sticky;
        top: 0;
        background: var(--karte);
        border-bottom: 2px solid var(--rahmen);
        white-space: nowrap;
      }
      /* Die Zeitspalten in Tabellenziffern und schmal: Sie werden ueberflogen,
         nicht gelesen. Der Satz bekommt den Rest der Breite. */
      .tagebuch td:first-child,
      .tagebuch td:nth-child(2) {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .tagebuch td.satz {
        width: 100%;
      }
      /* Ruecknahme und Berichtigung bleiben als Zeilen stehen (§6 U4) und
         sind deshalb markiert — sonst erkennt niemand, welche Zeile welche
         zuruecknimmt. */
      .tagebuch tr.ruecknahme,
      .tagebuch tr.berichtigung {
        background: var(--zeile-alt);
      }
      .tagebuch .marke {
        font-size: 0.75rem;
        border: 1px solid currentColor;
        border-radius: 3px;
        padding: 0 0.3rem;
        opacity: 0.8;
      }

      /* ---- Der Handscanner (M3.4) --------------------------------------- */

      .scanner {
        margin-top: 1.5rem;
        padding: 0.8rem;
        border: 1px solid var(--rahmen);
        border-radius: 6px;
      }
      .scannerkopf {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-bottom: 0.5rem;
      }
      .scannerkopf h2 {
        margin: 0;
      }
      /* Der Fortschritt steht gross und allein: Wer sieben Teile scannt,
         schaut zwischen den Scans genau auf diese eine Zeile. */
      .fortschritt {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0.5rem 0;
      }
      .vorschau dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.2rem 1rem;
        margin: 0 0 0.8rem;
        font-size: 0.9rem;
      }
      .vorschau dt {
        opacity: 0.7;
      }
      .vorschau dd {
        margin: 0;
      }

      /* ---- Hilfe: Tastenkarte und Abkuerzungen (M3.6) -------------------- */

      .hilfeknopf {
        margin-left: auto;
      }
      .hilfe {
        border: 1px solid var(--rahmen);
        border-radius: 6px;
        padding: 0.8rem;
      }
      .hilfekopf {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 0.5rem;
      }
      .hilfekopf h2 {
        margin: 0;
      }
      .hilfespalten {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        align-items: flex-start;
      }
      .hilfespalten > div {
        flex: 1 1 24rem;
        min-width: 0;
      }
      .hilfe h3 {
        font-size: 0.95rem;
        margin: 0 0 0.5rem;
      }
      .hilfe h4 {
        font-size: 0.85rem;
        margin: 0.8rem 0 0.2rem;
        opacity: 0.7;
      }
      .hilfe table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      .hilfe th,
      .hilfe td {
        text-align: left;
        vertical-align: top;
        padding: 0.1rem 0.5rem 0.1rem 0;
      }
      .hilfe th {
        white-space: nowrap;
      }
      /* Ein Kuerzel wird als Taste gesetzt: Es steht fuer einen Griff und
         nicht fuer ein Wort. */
      .hilfe kbd {
        font-family: inherit;
        font-size: 0.8rem;
        border: 1px solid var(--rahmen);
        border-bottom-width: 2px;
        border-radius: 3px;
        padding: 0 0.3rem;
      }
      /* Die Abkuerzungsliste hat 108 Zeilen; sie scrollt in sich, damit die
         Tastenkarte daneben stehen bleibt. */
      .akueli {
        max-height: 24rem;
        overflow-y: auto;
      }

      /* ---- Die Kernausgaben (M4.1) -------------------------------------- */

      .ausgaben {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--rahmen);
      }
      .ausgaben h2 {
        margin: 0 0.5rem 0 0;
      }
      .ausgaben select {
        display: inline;
        width: auto;
      }
      /* Der Pfad steht in voller Breite unter den Knoepfen und bricht um:
         Er ist lang, und abgeschnitten hilft er niemandem. */
      .ausgaben p {
        flex-basis: 100%;
        margin: 0.3rem 0 0;
        word-break: break-all;
      }

    </style>
  </head>
  <body>
    <main id="wurzel"></main>
    <script type="module" src="./haupt.tsx"></script>
  </body>
</html>
