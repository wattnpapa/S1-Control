        .anforderungstabelle td:empty {
          display: none;
        }
        .anforderungstabelle th[scope="row"] {
          font-weight: 700;
          background: var(--kopf-bg);
        }
        .anforderungstabelle td[data-label]::before,
        .anforderungstabelle th[data-label]::before {
          content: attr(data-label);
          flex: 0 0 6.5rem;
          font-weight: 400;
          color: var(--text-gedaempft, inherit);
        }
        .anforderungstabelle td.handlungen {
          flex-wrap: wrap;
          gap: 10px;
          justify-content: stretch;
          border-bottom: 0;
          padding: 10px;
        }
        .anforderungstabelle td.handlungen::before {
          flex: 1 1 100%;
        }
        .anforderungstabelle td.handlungen button {
          flex: 1 1 8rem;
          min-height: 44px;
        }
      }
      @media (pointer: coarse) {
        .handlungen {
          gap: 10px;
        }
        .handlungen button {
          min-height: 44px;
        }
      }

      .fuehrungsstelle h2 {
        font-size: 1rem;
        margin: 0.6rem 0 0.3rem;
      }
      .fuehrungsstelle h3 {
        font-size: 0.9rem;
        margin: 0.8rem 0 0.3rem;
      }
      /* Die Stammdaten des Einsatzes: eine Zeile, der Knopf daneben. */
      .stammdaten {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: end;
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
      }
      .stammdaten table {
        border-collapse: collapse;
      }
      .stammdaten th,
      .stammdaten td {
        border: 1px solid var(--rahmen);
        padding: 0.15rem 0.4rem;
        text-align: left;
      }
      .fuestsumme ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.85rem;
      }
      .dienstpostenneu,
      .planneu {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin: 0.5rem 0;
        font-size: 0.85rem;
      }
      .dienstpostenneu label,
      .planneu label {
        display: flex;
        gap: 0.3rem;
        align-items: center;
      }
      .dienstposten,
      .schichtplan {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .schichtplan {
        width: 100%;
      }
      .dienstposten th,
      .dienstposten td,
      .schichtplan th,
      .schichtplan td {
        border: 1px solid var(--rahmen);
        padding: 0.15rem 0.4rem;
        text-align: left;
        font-weight: 400;
      }
      .dienstposten thead th,
      .schichtplan thead th {
        font-weight: 700;
      }
      .dienstposten tr.summenzeile th,
      .dienstposten tr.summenzeile td {
        font-weight: 700;
      }
      /* §5.4.5 sinngemaess: Ein entfernter Posten bleibt sichtbar — sonst
         liesse er sich nicht wiederherstellen, weil ihn niemand mehr sieht. */
      .dienstposten tr.entfernt th,
      .dienstposten tr.entfernt td {
        opacity: 0.55;
        text-decoration: line-through;
      }
      /* Die Planzellen tragen mehrzeiligen Freitext (ZDM §1.14): Name,
         Herkunft, Erreichbarkeit. Sie duerfen breit sein. */
      .schichtplan input {
        width: 100%;
        min-width: 12rem;
      }

      /* ---- Der Programmstand (M7.2) ------------------------------------ */

      /* Ein Angebot und keine Warnung: Es liegt etwas bereit, jemand kann es
         einspielen, wenn die Lage es zulaesst. Ein abgelehntes Paket ist die
         andere Nachricht — entweder hat jemand vergessen zu signieren, oder
         es hat jemand versucht, der es nicht darf. */
      .programmstand {
        margin: 0.5rem 0;
        padding: 0.4rem 0.6rem;
        border-left: 3px solid var(--ok-linie);
        background: var(--ok-bg);
        font-size: 0.85rem;
      }
      .programmstand.abgelehnt {
        border-left-color: var(--err-linie);
        background: var(--err-bg);
      }

      /* ---- Der Eingangskorb (M6.1) ------------------------------------- */

      /* Die Ampel der Excel: gelb heisst „liegt an", gruen „uebernommen",
         grau „bewusst abgelehnt". Sie ist hier kein Anstrich, sondern der
         abgeleitete uebernahmeZustand (§5.8.1) — sie kann nicht vergessen
         werden, wie es in einer Tabelle geschieht. */
      .eingangskorb h2 {
        font-size: 1rem;
        margin: 0.6rem 0 0.3rem;
      }
      .eingangsfilter {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 0.5rem;
        font-size: 0.85rem;
      }
      .meldungstabelle {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      .meldungstabelle th,
      .meldungstabelle td {
        border: 1px solid var(--rahmen);
        padding: 0.15rem 0.4rem;
        text-align: left;
        font-weight: 400;
      }
      .meldungstabelle thead th {
        font-weight: 700;
      }
      /* Die Ampeln des Eingangskorbs sind dieselben Marken wie der Status in
         der Tabelle — eine Meldung, die „neu" ist, sieht aus wie eine
         Einheit, die im Anmarsch ist. */
      .ampel {
        display: inline-block;
        padding: 2px 6px;
        border: var(--rahmenbreite) solid var(--neutral-bg);
        background: var(--neutral-bg);
        color: var(--text-leise);
        font: 700 0.82em/1.3 var(--ui);
        letter-spacing: 0.04em;
      }
      .ampel-neu,
      .ampel-geaendert {
        background: var(--warn-bg);
        border-color: var(--warn-linie);
        color: var(--warn-text);
      }
      .ampel-uebernommen {
        background: var(--ok-bg);
        border-color: var(--ok-linie);
        color: var(--ok-text);
      }
      .ampel-abgelehnt {
        background: var(--neutral-bg);
        border-color: var(--rahmen);
      }
      /* §5.8.1: Eine abgelehnte Meldung bleibt sichtbar — Loeschen ist
         verboten. Sie wird blass, nicht unsichtbar. */
      .meldungstabelle tr.abgelehnt th,
      .meldungstabelle tr.abgelehnt td {
        opacity: 0.6;
      }
      .buendel {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 0.6rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px dashed var(--rahmen);
        font-size: 0.85rem;
      }
      .buendel label {
        display: flex;
        gap: 0.3rem;
        align-items: center;
      }
      .revisionen {
        margin-top: 0.8rem;
        padding: 0.5rem;
        border: 1px solid var(--rahmen);
        border-radius: 0.3rem;
      }
      .revisionenkopf {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .revisionenkopf h3 {
        font-size: 0.9rem;
        margin: 0;
      }
      .fassungen {
        margin: 0.4rem 0 0;
        padding-left: 1.4rem;
        font-size: 0.85rem;
      }
      .fassungen li.kopf {
        font-weight: 700;
      }
      .fassungen .felder {
        font-weight: 400;
        opacity: 0.75;
        font-size: 0.8rem;
      }

      /* Die Historie zeigt Staende, der Diff zeigt Bewegung — deshalb steht
         er unter den Fassungen und nicht zwischen ihnen (M6.2). */
      .bewegung {
        margin-top: 0.6rem;
        padding-top: 0.4rem;
        border-top: 1px dashed var(--rahmen);
        font-size: 0.85rem;
      }
      .bewegung h4 {
        font-size: 0.85rem;
        margin: 0 0 0.3rem;
      }
      .bewegung ul {
        margin: 0.1rem 0 0.4rem;
        padding-left: 1.2rem;
      }

      /* ---- Der Staerke-Monitor (M3.5) ---------------------------------- */

      /* Dieses Fenster wird nicht bedient, sondern gelesen — von der anderen
         Seite des Raums, im Vorbeigehen, oft schraeg. Daraus folgt alles
         Weitere und nichts davon ist Geschmack:

           * Fester schwarzer Grund mit weisser Schrift statt `color-scheme`.
             Der Monitor haengt an der Wand; welches Farbschema der Rechner
             gerade faehrt, ist fuer die Lesbarkeit aus fuenf Metern
             gleichgueltig — hoher Kontrast ist es nicht. Ein Fenster, das
             ueber Nacht hell wird, blendet den Raum.
           * Zentriert und ohne Zierrat: Es steht genau eine Zahl im Raum.
           * `tabular-nums` wie in der Statuszeile und im Abschnittsbaum: Wer
             Staerken vergleicht, liest Spalten und keine Woerter — und die
             Ziffern springen nicht, wenn die Zahl sich im Sekundentakt
             aendert. Die feste Zeichenbreite ist zugleich die Grundlage der
             dynamischen Schrift (siehe `schriftgroesse` in
             monitorZahlen.ts).

         Die Groesse der grossen Zeile steht bewusst **nicht** hier, sondern
         kommt als `style` aus der Komponente: Sie haengt an der Fenstergroesse
         und damit an einer Zahl, die erst zur Laufzeit feststeht. */
      .monitor {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
        background: var(--monitor-grund);
        color: var(--monitor-text);
        text-align: center;
        font-variant-numeric: tabular-nums;
        box-sizing: border-box;
      }
      .monitor p {
        margin: 0;
        max-width: 100%;
      }
      /* Die grosse Zahl: Ihre Groesse setzt die Komponente, hier stehen nur
         die Eigenschaften, die von ihr unabhaengig sind. `line-height: 1`
         verhindert, dass die Zeile bei grossen Graden mehr Platz beansprucht
         als sie fuellt — die Heuristik rechnet mit der Schrifthoehe. */
      .monitor .monitorstaerke {
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.02em;
        overflow-wrap: anywhere;
      }
      /* Die Beschriftung sagt, welche der drei Zahlen was ist. Sie darf klein
         sein: Wer sie einmal gelesen hat, liest danach nur noch die Zahl. */
      .monitor .monitorbeschriftung {
        font-size: clamp(0.8rem, 2vw, 1.4rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.65;
      }
      /* Die NATO-Zeit ist die zweitwichtigste Angabe des Monitors und deshalb
         deutlich groesser als der Fuss, aber klar unter der Staerke. */
      .monitor .monitorzeit {
        font-size: clamp(1.2rem, 6vw, 4rem);
        letter-spacing: 0.06em;
      }
      .monitor .monitorfuss {
        font-size: clamp(0.8rem, 2.5vw, 1.6rem);
        opacity: 0.75;
      }
      /* Ohne geoeffnete Akte bleibt der Monitor ruhig: gedaempft, ohne die
         grosse Zahl — er behauptet dann nichts ueber eine Staerke. */
      .monitor .monitorhinweis {
        font-size: clamp(1rem, 4vw, 2.4rem);
        opacity: 0.55;
      }
      /* ---- Monitor: Ansichten, Leiste, Menü, Punkte (S4.1) ------------- */

      .monitorrahmen {
        position: relative;
        min-height: 100vh;
        background: var(--monitor-grund);
      }
      .monitor .monitorunterzeile {
        font-size: clamp(1rem, 3.6vw, 2.6rem);
      }
      .monitor .monitornebenzeile {
        font-size: clamp(0.85rem, 2.4vw, 1.7rem);
        color: var(--monitor-leise);
      }
      .monitor .monitorwarn {
        color: var(--monitor-warn);
      }
      .monitor .monitorleise {
        color: var(--monitor-leise);
      }
      /* Die Tafeln (4c, 4h): Zeilen statt einer Zahl, die Größe setzt die
         Komponente aus `schriftgroesse`. */
      .monitortafel table {
        border-collapse: collapse;
        width: min(100%, 1400px);
        line-height: 1.35;
      }
      .monitortafel th,
      .monitortafel td {
        padding: 0.12em 0.5em;
        border-bottom: 1px solid var(--monitor-linie);
        text-align: right;
        font-weight: 400;
        white-space: nowrap;
      }
      .monitortafel th[scope="row"],
      .monitortafel thead th:first-child {
        text-align: left;
      }
      .monitortafel thead th {
        font-size: 0.5em;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--monitor-leise);
      }
      .monitortafel .trenner {
        border-left: 1px solid var(--monitor-linie);
      }
      .monitortafel small {
        font-size: 0.6em;
        color: var(--monitor-leise);
      }
      .monitortafel tr.naechste th,
      .monitortafel tr.naechste td,
      .monitortafel tr.summe th,
      .monitortafel tr.summe td {
        font-weight: 700;
      }
      .monitortafel tr.summe th,
      .monitortafel tr.summe td {
        border-top: 2px solid var(--monitor-text);
      }
      .monitortafel tr.anmarsch th,
      .monitortafel tr.anmarsch td {
        color: var(--monitor-leise);
        border-bottom: 0;
        padding-top: 0.5em;
      }
      .monitorunterkuenfte {
        border-collapse: collapse;
        margin: 0.4em 0;
      }
      .monitorunterkuenfte th,
      .monitorunterkuenfte td {
        padding: 0.1em 0.6em;
        border-bottom: 1px solid var(--monitor-linie);
        text-align: right;
        font-weight: 400;
        white-space: nowrap;
      }
      .monitorunterkuenfte th {
        text-align: left;
      }
      .monitorunterkuenfte .trenner {
        border-left: 1px solid var(--monitor-linie);
      }
      /* Die Tafel „Funkplan" (F4, Option 5a): links die Rufgruppe, rechts
         die Teilnehmer als Kacheln. Den Grad setzt die Komponente; alles
         hier ist relativ dazu. Namen brechen nicht um — eine Kachel bricht
         als Ganzes in die nächste Reihe. */
      .monitorfunkplan {
        justify-content: flex-start;
      }
      /* Der Fuß trägt hier die offene Arbeit mit Namen und wird lang; er
         steht kleiner als bei den Zahlenbildern und unten am Rand, damit die
         Tafel den Platz bekommt. */
      .monitorfunkplan .monitorfuss {
        margin-top: auto;
        padding: 0 110px;
        font-size: clamp(0.8rem, 1.7vw, 1.3rem);
      }
      .monitorfunkplan table {
        border-collapse: collapse;
        width: 100%;
        line-height: 1.2;
        text-align: left;
      }
      .monitorfunkplan th,
      .monitorfunkplan td {
        padding: 0.18em 0.5em;
        border-bottom: 1px solid var(--monitor-linie);
        font-weight: 400;
        vertical-align: top;
        text-align: left;
      }
      .monitorfunkplan thead th {
        font-size: 0.5em;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--monitor-leise);
      }
      .monitorfunkplan .funkname {
        font: 700 1.3em/1.1 var(--mono);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .monitorfunkplan th small {
        display: block;
        margin-top: 0.15em;
        font-size: 0.75em;
        line-height: 1.25;
        color: var(--monitor-leise);
      }
      .monitorfunkplan .marke-zustand.betriebsart {
        margin-left: 0.3em;
        padding: 0 0.35em;
        border: 1px solid var(--monitor-leise);
        background: transparent;
        color: var(--monitor-leise);
        font-size: 0.7em;
        vertical-align: 0.2em;
      }
      .monitorfunkplan .marke-zustand.betriebsart.warn {
        border-color: var(--monitor-warn);
        color: var(--monitor-warn);
      }
      .monitorfunkplan .marke-zustand.betriebsart.analog {
        border-style: dashed;
      }
      .funkkacheln {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25em 0.3em;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .funkkachel {
        display: inline-flex;
        flex-direction: column;
        gap: 0.05em;
        padding: 0.06em 0.45em 0.1em 0.5em;
        border: 1px solid var(--monitor-linie);
        border-left: 0.3em solid var(--monitor-linie);
        white-space: nowrap;
      }
      .funkkachel small {
        font: 0.75em/1.25 var(--mono);
        color: var(--monitor-leise);
      }
      .funkkachel.ton-ok {
        border-left-color: var(--monitor-ok);
      }
      .funkkachel.ton-warn {
        border-left-color: var(--monitor-warn);
      }
      .funkkachel.ton-fehler {
        border-left-color: var(--monitor-fehler);
      }
      .funkkachel.ton-ruhe {
        border-left-color: var(--monitor-leise);
        opacity: 0.75;
      }
      /* Kein Kontakt über der Schwelle: der ganze Rahmen in Bernstein, die
         linke Kante behält den Status. */
      .funkkachel.still {
        border-top-color: var(--monitor-warn);
        border-right-color: var(--monitor-warn);
        border-bottom-color: var(--monitor-warn);
        box-shadow: inset 0 0 0 1px var(--monitor-warn);
      }
      .funkkachel.mithoerer {
        border-top-style: dashed;
        border-right-style: dashed;
        border-bottom-style: dashed;
      }
      /* Die Leiste erscheint nur bei Mausbewegung und liegt über dem Bild. */
      .monitorleiste {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        background: var(--monitor-leiste);
        border-bottom: 1px solid var(--monitor-linie);
      }
      .monitorleiste button {
        height: 40px;
        border: 0;
        border-right: 1px solid var(--monitor-linie);
        background: transparent;
        color: var(--monitor-leise);
        font-size: 15px;
      }
      .monitorleiste button[aria-pressed="true"] {
        background: var(--monitor-text);
        color: var(--monitor-grund);
        font-weight: 700;
      }
      .monitorleistefrei {
        flex: 1;
      }
      .monitorpunkte {
        position: absolute;
        right: 14px;
        bottom: 14px;
        display: flex;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .monitorpunkte li {
        width: 9px;
        height: 9px;
        border: 1px solid var(--monitor-leise);
      }
      .monitorpunkte li.aktiv {
        background: var(--monitor-text);
        border-color: var(--monitor-text);
      }
      .monitorpunkte li.naechste {
        border: 2px solid var(--monitor-warn);
      }
      /* Das Kontextmenü ist ein Renderer-Element und sieht in Electron und
         im Browser gleich aus; seine Farben folgen dem Erscheinungsbild. */
      .monitormenuegrund {
        position: fixed;
        inset: 0;
        z-index: 20;
      }
      .monitormenue {
        position: absolute;
        min-width: 270px;
        padding: 6px 0;
        background: var(--karte);
        color: var(--text);
        border: var(--rahmenbreite) solid var(--rahmen);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        text-align: left;
      }
      .monitormenuetitel {
        margin: 4px 14px 6px;
        font: 600 0.78em/1.2 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-leise);
      }
      .monitormenue button {
        display: flex;
        align-items: center;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
      }
      .monitormenue button:hover,
      .monitormenue button[aria-checked="true"] {
        background: var(--zeile-gewaehlt);
      }
      .monitormenue .haken {
        display: inline-block;
        width: 1.4em;
      }
      .monitormenue kbd {
        margin-left: auto;
        padding-left: 18px;
        font: 0.8em var(--mono);
        color: var(--text-leiser);
      }
      .monitormenue hr {
        margin: 6px 0;
        border: 0;
        border-top: var(--rahmenbreite) solid var(--rahmen-weich);
      }

      /* ---- Das Einsatztagebuch (M3.3) ----------------------------------- */

      .tagebuch {
        margin-top: 1.5rem;
      }
      .tagebuchkopf {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-bottom: 0.5rem;
      }
      .tagebuchkopf h2 {
        margin: 0 0.5rem 0 0;
      }
      .tagebuch table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      .tagebuch th,
      .tagebuch td {
        border-bottom: 1px solid var(--rahmen-weich);
        padding: 0.15rem 0.4rem;
        text-align: left;
        vertical-align: top;
      }
      .tagebuch thead th {
        position: sticky;
        top: 0;
        background: var(--karte);
        border-bottom: 2px solid var(--rahmen);
        white-space: nowrap;
      }
      /* Die Zeitspalten in Tabellenziffern und schmal: Sie werden ueberflogen,
         nicht gelesen. Der Satz bekommt den Rest der Breite. */
      .tagebuch td:first-child,
      .tagebuch td:nth-child(2) {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .tagebuch td.satz {
        width: 100%;
      }
      /* Ruecknahme und Berichtigung bleiben als Zeilen stehen (§6 U4) und
         sind deshalb markiert — sonst erkennt niemand, welche Zeile welche
         zuruecknimmt. */
      .tagebuch tr.ruecknahme,
      .tagebuch tr.berichtigung {
        background: var(--zeile-alt);
      }
      /* Handy: Jeder Eintrag ist eine Karte — Zeiten klein oben, der Vorgang
         ueber die volle Breite, Akteur und Rechner klein darunter. So wird der
         Vorgang nicht in eine 112-px-Spalte gequetscht. */
      @media (max-width: 700px) {
        .tagebuch table,
        .tagebuch tbody {
          display: block;
          width: 100%;
        }
        .tagebuch thead {
          display: none;
        }
        .tagebuch tr {
          display: flex;
          flex-wrap: wrap;
          gap: 0 12px;
          padding: 6px 4px;
          border-bottom: 1px solid var(--rahmen-weich);
        }
        .tagebuch td {
          order: 2;
          padding: 0;
          border: 0;
          font-size: 0.8rem;
          color: var(--text-gedaempft, inherit);
        }
        .tagebuch td:first-child,
        .tagebuch td:nth-child(2) {
          order: 0;
        }
        .tagebuch td:empty {
          display: none;
        }
        .tagebuch td.satz {
          order: 1;
          flex: 1 1 100%;
          width: auto;
          padding: 2px 0;
          font-size: 0.9rem;
          color: var(--text);
          overflow-wrap: anywhere;
        }
      }
      .tagebuch .marke {
        font-size: 0.75rem;
        border: 1px solid currentColor;
        border-radius: 3px;
        padding: 0 0.3rem;
        opacity: 0.8;
      }

      /* ---- Der Handscanner (M3.4) --------------------------------------- */

      .scanner {
        margin-top: 1.5rem;
        padding: 0.8rem;
        border: 1px solid var(--rahmen);
        border-radius: 6px;
      }
      .scannerkopf {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-bottom: 0.5rem;
      }
      .scannerkopf h2 {
        margin: 0;
      }
      /* Der Fortschritt steht gross und allein: Wer sieben Teile scannt,
         schaut zwischen den Scans genau auf diese eine Zeile. */
      .fortschritt {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0.5rem 0;
      }
      .vorschau dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.2rem 1rem;
        margin: 0 0 0.8rem;
        font-size: 0.9rem;
      }
      .vorschau dt {
        opacity: 0.7;
      }
      .vorschau dd {
        margin: 0;
      }

      /* ---- Hilfe: Tastenkarte und Abkuerzungen (M3.6) -------------------- */

      .hilfe {
        border: 1px solid var(--rahmen);
        border-radius: 6px;
        padding: 0.8rem;
      }
      .hilfekopf {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 0.5rem;
      }
      .hilfekopf h2 {
        margin: 0;
      }
      .hilfespalten {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        align-items: flex-start;
      }
      .hilfespalten > div {
        flex: 1 1 24rem;
        min-width: 0;
      }
      .hilfe h3 {
        font-size: 0.95rem;
        margin: 0 0 0.5rem;
      }
      .hilfe h4 {
        font-size: 0.85rem;
        margin: 0.8rem 0 0.2rem;
        opacity: 0.7;
      }
      .hilfe table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.85rem;
      }
      .hilfe th,
      .hilfe td {
        text-align: left;
        vertical-align: top;
        padding: 0.1rem 0.5rem 0.1rem 0;
      }
      .hilfe th {
        white-space: nowrap;
      }
      /* Ein Kuerzel wird als Taste gesetzt: Es steht fuer einen Griff und
         nicht fuer ein Wort. */
      .hilfe kbd {
        font-family: inherit;
        font-size: 0.8rem;
        border: 1px solid var(--rahmen);
        border-bottom-width: 2px;
        border-radius: 3px;
        padding: 0 0.3rem;
      }
      /* Die Abkuerzungsliste hat 108 Zeilen; sie scrollt in sich, damit die
         Tastenkarte daneben stehen bleibt. */
      .akueli {
        max-height: 24rem;
        overflow-y: auto;
      }

      /* ---- Die Kernausgaben (M4.1) -------------------------------------- */

      .ausgaben {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--rahmen);
      }
      .ausgaben h2 {
        margin: 0 0.5rem 0 0;
      }
      .ausgaben select {
        display: inline;
        width: auto;
      }
      /* Der Pfad steht in voller Breite unter den Knoepfen und bricht um:
         Er ist lang, und abgeschnitten hilft er niemandem. */
      .ausgaben p {
        flex-basis: 100%;
        margin: 0.3rem 0 0;
        word-break: break-all;
      }
      /* Die erzeugte Datei: Pfad und Knoepfe auf einer Zeile, ebenfalls in
         voller Breite (Ausgabedatei.tsx). */
      .ausgaben .ausgabedatei {
        flex-basis: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.5rem;
        word-break: break-all;
      }
      /* Der Abschluss des Einsatzes steht als eigener Block unter den
         Ausgaben (Einsatzabschluss.tsx). */
      .ausgaben .einsatzabschluss {
        flex-basis: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.5rem;
        margin-top: 0.75rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--rahmen);
      }
      .ausgaben .einsatzabschluss h3 {
        margin: 0 0.5rem 0 0;
      }
      .ausgaben .einsatzabschluss > p {
        flex-basis: auto;
        margin: 0;
      }

      /* ---- Schmale Bildschirme (Handy, Tablet hochkant) ------------------
         Die Desktop-Regeln oben bleiben unberuehrt; hier wird nur
         zurueckgenommen, was ueber die Breite hinausragt. Die Seite scrollt
         nie waagerecht: Reiter, Tabellen und die Hilfe scrollen in sich. */

      /* Touch: jedes Ziel mindestens 44 px, auch mit Handschuh. */
      @media (pointer: coarse) {
        button,
        .ausgabeknoepfe a,
        .kopfband .reiter button,
        .kopfband .fenstermenueknopf,
        .klappmenueliste [role^="menuitem"],
        .monitorauswahl button {
          min-height: 44px;
          min-width: 44px;
        }
        .kopfband .fenstermenueknopf {
          width: 44px;
          height: 44px;
        }
        input:not([type="checkbox"]):not([type="radio"]),
        select {
          min-height: 44px;
        }
        input[type="checkbox"],
        input[type="radio"] {
          width: 24px;
          height: 24px;
        }
      }
      .ausgabeknoepfe a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 13px;
        border: var(--rahmenbreite) solid var(--knopf-rahmen);
        color: var(--text);
        text-decoration: none;
        font: 400 var(--schrift) / 1.2 var(--ui);
      }

      @media (max-width: 900px) {
        html,
        body {
          max-width: 100vw;
          overflow-x: hidden;
        }
        .kopfband {
          padding: 8px 12px 0;
        }
        .kopfband .zeile {
          flex-wrap: wrap;
          gap: 6px 14px;
          padding: 4px 0 6px;
        }
        .kopfband h1 {
          font-size: 17px;
        }
        .kopfband .kennzahl .wert {
          font-size: 24px;
        }
        /* Das Menü haengt am Kopfband und nutzt dessen Breite, damit es nie
           links oder rechts aus dem Bild laeuft (wie die Zaehlregel). */
        .kopfband .fenstermenue {
          position: static;
        }
        .fenstermenue > .klappmenueliste,
        .monitorauswahl {
          left: 8px;
          right: 8px;
          min-width: 0;
        }
        /* Die Reiter scrollen in einer eigenen Flaeche; die Seite bleibt stehen. */
        .kopfband .reiter {
          overflow-x: auto;
          overflow-y: hidden;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: thin;
        }
        .kopfband .reiter button {
          flex: 0 0 auto;
          white-space: nowrap;
          padding: 10px 12px 8px;
        }
        main {
          min-width: 0;
        }
      }
      @media (max-width: 700px) {
        .lagespalten {
          flex-direction: column;
          align-items: stretch;
        }
        .lagespalten > * {
          box-sizing: border-box;
          min-width: 0;
          max-width: 100%;
        }
        .baum,
        :root[data-theme="feld"] .baum {
          box-sizing: border-box;
          flex: 1 1 auto;
          min-width: 0;
          width: 100%;
        }
      }
      @media (max-width: 900px) {
        /* Tabellen ohne eigenen Rahmen scrollen als Block in sich. */
        table {
          display: block;
          max-width: 100%;
          overflow-x: auto;
        }
        .tabellenrahmen table {
          display: table;
        }
        .tabellenrahmen {
          max-width: 100%;
        }
        .hilfespalten > div {
          flex-basis: 100%;
        }
        .hilfekopf {
          position: sticky;
          top: 0;
          z-index: 2;
          background: var(--karte);
          flex-wrap: wrap;
        }
        .reiterleiste {
          overflow-x: auto;
        }
        .reiterleiste button {
          flex: 0 0 auto;
          white-space: nowrap;
        }
      }
      @media (max-width: 700px) {
        /* Die Auswahlleiste bricht um: Zahl oben, Schritte darunter. */
        .auswahlleiste .auswahlzahl,
        .auswahlleiste .auswahlschluss {
          flex: 1 1 100%;
          margin: 0;
        }
        .auswahlleiste button.entfernen {
          margin-left: 0;
        }
        /* Das Kontextmenue liegt unten am Rand, in voller Breite, statt an
           einer Mausposition, die es auf dem Handy nicht gibt. */
        .kontextmenue {
          left: 8px;
          right: 8px;
          top: auto;
          bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        }
        .kontextmenue > .klappmenueliste {
          min-width: 0;
          width: 100%;
          max-height: 70vh;
          overflow-y: auto;
        }
      }
      @media (max-width: 700px) {
        /* Dialoge nutzen die Breite des Geraets statt 22 rem Mindestbreite. */
        .maskengrund {
          padding: 8px;
        }
        .maske,
        .maske:has(.zeichenwahl) {
          min-width: 0;
          width: 100%;
          max-width: 100vw;
        }
        .maskenknoepfe {
          flex-wrap: wrap;
        }
        .maskenknoepfe button {
          flex: 1 1 auto;
        }
      }

      @media (max-width: 480px) {
        main {
          padding: 8px;
        }
        main > section,
        .lagespalten > .baum,
        .lagespalten > .einheiten,
        .lage > .ausgaben,
        .lage > .blaetter,
        .lage > .tagebuch,
        .karte {
          padding: 10px;
        }
        /* Vollbild: Titel oben, Knoepfe erreichbar, der Rest scrollt in sich. */
        .maskengrund {
          padding: 0;
          align-items: stretch;
        }
        .maske {
          height: 100%;
          max-height: 100%;
          border-left: 0;
          border-right: 0;
          box-shadow: none;
        }
        .maskenknoepfe {
          position: sticky;
          bottom: 0;
          margin: 1rem -16px -16px;
          padding: 10px 16px;
          background: var(--karte);
          border-top: 1px solid var(--rahmen);
        }
      }

      /* ---- Zwischenbreiten, Querformat, Banner, Ausgabe ------------------
         Ergaenzt die Bloecke oben: Tablet hochkant und Handy quer (bis
         900 px) umbrechen das Kopfband, die Reiter scrollen in sich. Bei
         flacher Anzeige (Handy quer) belegt das Kopfband eine Zeile, und
         Dialoge halten ihre Knopfleiste im Bild. */

      /* Das Verbindungsbanner steht immer fest am oberen Bildrand und liegt
         ueber jedem Dialog. `position: sticky` genuegt nicht: Bei
         `overflow-x: hidden` auf html/body (bis 900 px) scrollt das Banner
         mit weg. Der Koerper rueckt um die gemessene Hoehe
         (--bannerhoehe, Verbindungsbanner.tsx) nach unten, nichts wird
         verdeckt und es entsteht kein Seitenscroll (left/right statt 100vw). */
      .verbindungsbanner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        box-sizing: border-box;
        margin: 0 !important;
        max-height: 40vh;
        overflow-y: auto;
      }
      body:has(.verbindungsbanner) {
        padding-top: var(--bannerhoehe, 0px);
      }
      body:has(.verbindungsbanner) .maskengrund {
        padding-top: calc(var(--bannerhoehe, 0px) + 8px);
      }

      /* Ausgabe: Knoepfe mit Abstand, nichts laeuft rechts aus dem Bild. */
      .ausgabedatei {
        max-width: 100%;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .ausgabedatei .ausgabeknoepfe {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 4px;
      }

      @media (pointer: coarse) {
        label:has(> input[type="checkbox"]) {
          display: flex;
          align-items: center;
          gap: 10px;
          min-height: 44px;
        }
        label > input[type="checkbox"] {
          flex: 0 0 auto;
          margin: 0;
        }
        button:disabled {
          opacity: 1;
        }
      }

      @media (max-width: 900px), (max-height: 500px) {
        .maskengrund {
          padding: 8px;
        }
        .maske {
          min-width: 0;
          max-width: min(32rem, 100%);
          max-height: 100%;
        }
        /* Die Knopfleiste haftet unten, der Inhalt scrollt in der Maske. */
        .maskenknoepfe {
          position: sticky;
          /* -16 px hebt das Polster der Maske auf: Die Leiste sitzt bündig unten. */
          bottom: -16px;
          z-index: 1;
          flex-wrap: wrap;
          margin: 1rem -16px -16px;
          padding: 10px 16px;
          background: var(--karte);
          border-top: 1px solid var(--rahmen);
        }
        .maskenknoepfe button {
          height: auto;
          min-height: var(--knopfhoehe);
          padding-top: 6px;
          padding-bottom: 6px;
          white-space: normal;
        }
        @media (pointer: coarse) {
          .maskenknoepfe button {
            min-height: 44px;
          }
        }
        .maskenknoepfe > p,
        .maskenknoepfe > .hinweistext {
          flex: 1 1 100%;
          margin: 0;
        }
      }
      @media (max-width: 480px) {
        .maske {
          max-width: 100%;
        }
      }

      /* Flache Anzeige (Handy quer): das Kopfband ist eine Zeile plus Reiter. */
      @media (max-height: 500px) and (max-width: 1000px) {
        .kopfband {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 0 10px;
          padding: 2px 12px 0;
        }
        .kopfband > .zeile {
          flex: 1 1 0;
          min-width: 0;
          flex-wrap: wrap;
          gap: 2px 12px;
          padding: 0;
        }
        .kopfband > .reiter {
          flex: 1 1 100%;
          min-width: 0;
        }
        .kopfband .marke {
          display: none;
        }
        .kopfband h1 {
          font-size: 15px;
        }
        .kopfband .kennzahl {
          flex-direction: row;
          align-items: baseline;
          gap: 6px;
        }
        .kopfband .kennzahl .wert {
          font-size: 20px;
        }
        .kopfband .kennzahl .nebenwert {
          font-size: 11px;
          white-space: nowrap;
        }
        .vorlagenliste {
          max-height: 6rem;
        }
      }

      /* Sehr schmal (320 px): Suchfelder und Bloecke bleiben im Bild. */
      @media (max-width: 480px) {
        .suchfeld input {
          width: 100%;
          max-width: 100%;
        }
        main,
        main > * {
          min-width: 0;
          max-width: 100%;
        }
        .fueorgflaeche {
          flex-direction: column;
          align-items: stretch;
        }
        .einrichtungen {
          flex: 0 1 auto;
          min-width: 0;
          border-left: 0;
          padding-left: 0;
        }
      }

    </style>
  </head>
  <body>
    <!-- Der Wurzelknoten ist ein `div` und kein `main`: Der Arbeitsplatz
         bringt sein eigenes `main` mit, und das aeussere trug sonst dessen
         Regeln mit — 14 px Polster als weisser Ring um Kopfband
         und Statuszeile, und dazu 28 px mehr Hoehe als das
         Fenster hat, weshalb die Statuszeile unten abgeschnitten war. -->
    <div id="wurzel"></div>
    <script type="module" src="./haupt.tsx"></script>
  </body>
